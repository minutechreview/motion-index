<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1088,height=800">
<title>Paper pop-up book: from cocoa pod to chocolate</title>
<style>
@font-face{font-family:Fraunces;src:url('assets/fonts/fraunces800.woff2');font-weight:800}
@font-face{font-family:Fraunces;src:url('assets/fonts/fraunces600i.woff2');font-weight:600;font-style:italic}
*{box-sizing:border-box}html,body{margin:0;width:1088px;height:800px;overflow:hidden}
#root{position:relative;width:1088px;height:800px;overflow:hidden;background:#2a1a12}
canvas{position:absolute;inset:0;width:100%;height:100%}
.grain{position:absolute;inset:0;pointer-events:none;background:url('assets/noise.png') repeat;opacity:.08;mix-blend-mode:multiply}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(20,8,2,.55) 100%)}
</style>
</head>
<body><main id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1088" data-height="800" data-fps="30">
<canvas id="stage" class="clip" data-start="0" data-duration="6" data-track-index="1" data-layout-ignore></canvas>
<div class="vig" data-layout-ignore></div><div class="grain" data-layout-ignore></div></main>
<script src="assets/vendor/three.min.js"></script><script src="assets/vendor/gsap.min.js"></script><script>
/* Motion Index original: a die-cut pop-up book whose page turns between beats. Inspired by Futurepedia's 3D Style Atlas (Paper Pop-Up); our own code. */
(() => {
 const T=THREE, W=1088, H=800, D=6, PI=Math.PI;
 const clamp=n=>Math.max(0,Math.min(1,n)), smooth=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
 const rng=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(17);
 const renderer=new T.WebGLRenderer({canvas:document.querySelector('#stage'),antialias:true,preserveDrawingBuffer:true});
 renderer.setPixelRatio(1);renderer.setSize(W,H,false);renderer.outputColorSpace=T.SRGBColorSpace;
 renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
 const scene=new T.Scene();scene.background=new T.Color(0x24160f);
 const camera=new T.PerspectiveCamera(30,W/H,.1,100);
 scene.add(new T.HemisphereLight(0xffe7c8,0x3a2414,.75));
 const lamp=new T.SpotLight(0xffd9a6,260,40,.62,.55,1.6);lamp.position.set(-5,11,6);lamp.target.position.set(0,0,-.4);
 lamp.castShadow=true;lamp.shadow.mapSize.set(2048,2048);lamp.shadow.bias=-.0004;lamp.shadow.radius=4;scene.add(lamp,lamp.target);
 const fill=new T.DirectionalLight(0xbcd4ff,.45);fill.position.set(6,5,4);scene.add(fill);
 const tex=(w,h,draw)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;return t};
 // Walnut table.
 const wood=tex(1024,1024,(g,w,h)=>{g.fillStyle='#5a3620';g.fillRect(0,0,w,h);
  for(let i=0;i<260;i++){const y=(i*37.7)%h,a=.05+(i%7)*.012;g.strokeStyle=i%3?`rgba(30,14,6,${a})`:`rgba(150,95,55,${a})`;g.lineWidth=1+(i%4);
   g.beginPath();for(let x=0;x<=w;x+=16)g.lineTo(x,y+Math.sin(x*.012+i)*6+Math.sin(x*.004+i*.3)*14);g.stroke()}});
 wood.wrapS=wood.wrapT=T.RepeatWrapping;wood.repeat.set(2,2);
 const table=new T.Mesh(new T.PlaneGeometry(60,40),new T.MeshStandardMaterial({map:wood,roughness:.62}));table.rotation.x=-PI/2;table.receiveShadow=true;scene.add(table);
 // Printed page art: soft paper with a printed ground and a number badge.
 function pageArt(base,ink,num,pattern){return tex(800,1000,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);pattern(g,w,h);
  for(let i=0;i<3000;i++){g.fillStyle=`rgba(80,50,20,${rng()*.035})`;g.fillRect(rng()*w,rng()*h,2,2)}
  if(num){g.strokeStyle=ink;g.lineWidth=7;g.beginPath();g.arc(118,h-120,46,0,PI*2);g.stroke();g.fillStyle=ink;g.font='800 58px Fraunces';g.textAlign='center';g.textBaseline='middle';g.fillText(num,118,h-116)}})}
 const dashes=(col)=>(g,w,h)=>{g.strokeStyle=col;g.lineWidth=5;g.setLineDash([22,18]);g.beginPath();g.moveTo(0,h*.72);g.bezierCurveTo(w*.3,h*.6,w*.6,h*.86,w,h*.74);g.stroke();g.setLineDash([])};
 const tiles=(g,w,h)=>{for(let y=0;y<h;y+=100)for(let x=0;x<w;x+=100){g.fillStyle=((x+y)/100)%2?'#e9eef0':'#d6e4ea';g.fillRect(x,y,100,100)}
  g.strokeStyle='rgba(60,90,110,.25)';g.lineWidth=3;for(let x=0;x<=w;x+=100){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=0;y<=h;y+=100){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}};
 const paper=(map)=>new T.MeshStandardMaterial({map,roughness:.92});
 const coreMat=new T.MeshStandardMaterial({color:0xf3ead6,roughness:.95});
 // Book: two boards, the left page, the right page beneath, and one turning leaf hinged on the spine (z axis).
 const PW=3.9,PD=5,book=new T.Group();scene.add(book);
 const board=new T.MeshStandardMaterial({color:0x7a2f2a,roughness:.7});
 [-1,1].forEach(s=>{const b=new T.Mesh(new T.BoxGeometry(PW+.12,.1,PD+.2),board);b.position.set(s*(PW/2+.03),.05,0);b.receiveShadow=true;b.castShadow=true;book.add(b)});
 const pageGeo=new T.BoxGeometry(PW,.06,PD);
 const pageMats=(top)=>[coreMat,coreMat,paper(top),coreMat,coreMat,coreMat];
 const leftPage=new T.Mesh(pageGeo,pageMats(pageArt('#f4e7c6','#6b3a22','1',dashes('rgba(110,70,40,.35)'))));leftPage.position.set(-PW/2,.13,0);
 const rightPage=new T.Mesh(pageGeo,pageMats(pageArt('#e4eef2','#2c5a72','2',tiles)));rightPage.position.set(PW/2,.13,0);
 [leftPage,rightPage].forEach(p=>{p.receiveShadow=true;book.add(p)});
 const leaf=new T.Group();leaf.position.set(0,.2,0);book.add(leaf);
 const leafMesh=new T.Mesh(new T.BoxGeometry(PW,.04,PD),[coreMat,coreMat,paper(pageArt('#f4e7c6','#6b3a22','',dashes('rgba(110,70,40,.35)'))),paper(pageArt('#e4eef2','#2c5a72','',tiles)),coreMat,coreMat]);
 leafMesh.position.x=PW/2;leafMesh.castShadow=true;leafMesh.receiveShadow=true;leaf.add(leafMesh);
 // Die-cut card: an extruded outline, printed on the front, pale core on every cut edge.
 function card(shape,front,depth=.035){const g=new T.ExtrudeGeometry(shape,{depth,bevelEnabled:false,curveSegments:24});
  const m=new T.Mesh(g,[front,coreMat]);m.castShadow=true;m.receiveShadow=true;return m}
 const flat=(c)=>new T.MeshStandardMaterial({color:c,roughness:.9});
 const circle=(r,x=0,y=0)=>{const s=new T.Shape();s.absarc(x,y,r,0,PI*2,false);return s};
 const ellipse=(rx,ry,x=0,y=0)=>{const s=new T.Shape();s.absellipse(x,y,rx,ry,0,PI*2,false,0);return s};
 const rect=(w,h,x=0,y=0,r=.06)=>{const s=new T.Shape();s.moveTo(x-w/2+r,y);s.lineTo(x+w/2-r,y);s.quadraticCurveTo(x+w/2,y,x+w/2,y+r);s.lineTo(x+w/2,y+h-r);
  s.quadraticCurveTo(x+w/2,y+h,x+w/2-r,y+h);s.lineTo(x-w/2+r,y+h);s.quadraticCurveTo(x-w/2,y+h,x-w/2,y+h-r);s.lineTo(x-w/2,y+r);s.quadraticCurveTo(x-w/2,y,x-w/2+r,y);return s};
 const hills=(w,h,bumps,seed)=>{const s=new T.Shape();s.moveTo(-w/2,0);for(let i=0;i<=40;i++){const x=-w/2+w*i/40;s.lineTo(x,h*(.6+.4*Math.sin(i/40*PI*bumps+seed)))}s.lineTo(w/2,0);s.lineTo(-w/2,0);return s};
 // A layer stands up from a hinge line at depth z; stand 0 = flat on the page, 1 = upright.
 function layer(z,parts,lean=0){const hinge=new T.Group();hinge.position.set(0,.2,z);const inner=new T.Group();hinge.add(inner);
  parts.forEach(p=>inner.add(p));hinge.userData={lean};return hinge}
 const ribbonTex=(text)=>tex(1400,200,(g,w,h)=>{g.fillStyle='#fbf3df';g.fillRect(0,0,w,h);g.strokeStyle='#b23a2e';g.lineWidth=6;g.strokeRect(40,24,w-80,h-48);
  g.fillStyle='#2b1a10';g.textAlign='center';g.textBaseline='middle';const [a,b]=text;g.font='800 92px Fraunces';const wa=g.measureText(a+' ').width;
  g.font='italic 600 92px Fraunces';const wb=g.measureText(b).width;let x=w/2-(wa+wb)/2;g.textAlign='left';g.font='800 92px Fraunces';g.fillText(a+' ',x,h/2+4);g.font='italic 600 92px Fraunces';g.fillStyle='#b23a2e';g.fillText(b,x+wa,h/2+4)});
 function ribbon(text){const s=new T.Shape(),w=3.6,h=.5;s.moveTo(-w/2-.25,0);s.lineTo(w/2+.25,0);s.lineTo(w/2+.05,h/2);s.lineTo(w/2+.25,h);s.lineTo(-w/2-.25,h);s.lineTo(-w/2-.05,h/2);s.lineTo(-w/2-.25,0);
  const map=ribbonTex(text);map.repeat.set(1/w,1/h);map.offset.set(.5,0);const m=card(s,new T.MeshStandardMaterial({map,roughness:.85}));m.position.y=.04;return m}
 // Spread 1: a cocoa tree on a hill, pods on the trunk, a parrot; caption ribbon in front.
 const S1=[],S2=[];
 const sun=card(circle(.62),flat(0xf2b544));sun.position.set(1.5,1.95,0);
 const back1=layer(-1.7,[card(hills(6.6,1.1,3,.4),flat(0x6f9a4a)),sun]);
 const trunk=card(rect(.42,2.3,0,0,.1),flat(0x6d4428));trunk.position.set(-.5,0,0);
 const canopy=new T.Group();[[-.5,2.5,1],[-1.25,2.15,.8],[.25,2.2,.82],[-.9,2.9,.7],[-.05,2.85,.72]].forEach(([x,y,r],i)=>{const c=card(circle(r),flat(i%2?0x2f6b3a:0x3f8446));c.position.set(x,y,i*.012);canopy.add(c)});
 const pods=[];[[-.32,1.3,0xc4672b],[-.72,1.0,0xa34a22],[-.38,.62,0xd98a2f],[-.72,1.6,0xb85b28]].forEach(([x,y,c])=>{const p=card(ellipse(.15,.27),flat(c),.05);p.position.set(x,y,.05);pods.push(p)});
 const tree=layer(-.75,[trunk,canopy,...pods]);
 const bird=new T.Group();const body=card(ellipse(.32,.22),flat(0x2f8f8a));const wing=card(ellipse(.22,.12),flat(0xe0533c),.04);wing.position.set(-.05,.03,.04);
 const beak=card(circle(.07),flat(0xf2b544),.03);beak.position.set(.3,.06,.02);bird.add(body,wing,beak);bird.position.set(1.15,1.6,0);
 const birdLayer=layer(-.25,[bird]);
 const bush=layer(.45,[(()=>{const g=new T.Group();[[-2,0,.42],[-1.55,0,.32],[1.7,0,.4],[2.1,0,.3]].forEach(([x,y,r],i)=>{const c=card(circle(r),flat(i%2?0x4c8c3f:0x5fa04a));c.position.set(x,y,0);g.add(c)});return g})()]);
 const rib1=layer(1.35,[ribbon(['Pods grow on','cocoa trees.'])]);
 S1.push(back1,tree,birdLayer,bush,rib1);
 // Spread 2: a window, a chocolate bar with a bite, a steaming mug; caption ribbon in front.
 const win=new T.Group();const frame=card(rect(2.6,2,0,0,.08),flat(0xd9533f));const glass=card(rect(2.2,1.6,0,.2,.05),flat(0x9fd3e6),.02);glass.position.z=.04;
 const mull=card(rect(.08,1.6,0,.2,.02),flat(0xd9533f),.02);mull.position.z=.07;win.add(frame,glass,mull);win.position.set(-.2,.9,0);
 const back2=layer(-1.7,[win]);
 const choc=new T.Group();const barS=rect(1.7,2.3,0,0,.1);const bar=card(barS,flat(0x5b3020),.06);choc.add(bar);
 for(let r=0;r<4;r++)for(let c=0;c<3;c++){if(r===3&&c===2)continue;const sq=card(rect(.46,.46,0,0,.06),flat(0x6e3b27),.03);sq.position.set(-.53+c*.53,.18+r*.53,.06);choc.add(sq)}
 const wrap=card(rect(1.78,.9,0,0,.04),flat(0xe7c25a),.04);wrap.position.set(0,-.05,.08);choc.add(wrap);choc.position.set(-.85,0,0);
 const mug=new T.Group();const mb=card(rect(1.05,1.15,0,0,.12),flat(0xf0f0ea),.05);const handle=(()=>{const s=circle(.34);s.holes.push((()=>{const h=new T.Path();h.absarc(0,0,.2,0,PI*2,true);return h})());const m=card(s,flat(0xf0f0ea),.05);m.position.set(.56,.58,-.01);return m})();
 const band=card(rect(1.06,.22,0,.4,.02),flat(0x2c5a72),.02);band.position.z=.05;mug.add(handle,mb,band);mug.position.set(1.05,0,0);
 const steam=[];[0,1,2].forEach(i=>{const s=new T.Shape();s.moveTo(0,0);for(let k=0;k<=12;k++)s.lineTo(Math.sin(k/12*PI*2)*.08,k*.06);for(let k=12;k>=0;k--)s.lineTo(Math.sin(k/12*PI*2)*.08+.07,k*.06);
  const m=card(s,flat(0xfff7ea),.02);m.position.set(.86+i*.2,1.3,0);steam.push(m)});
 const front2=layer(-.55,[choc,mug,...steam]);
 const rib2=layer(1.35,[ribbon(['Beans become','chocolate.'])]);
 S2.push(back2,front2,rib2);
 [...S1,...S2].forEach(l=>book.add(l));
 // Camera: slow push in on spread 1, follow the page turn, settle on spread 2, return.
 function draw(t){
  const turn=smooth(2.3,3.5,t)*(1-smooth(5.4,6,t));const th=turn*PI;leaf.rotation.z=th;
  const back=smooth(5.4,6,t),s1=Math.max(1-smooth(2.05,2.7,t),back>0?smooth(.55,.98,back):0),s2=smooth(.55,.98,turn);
  const pose=(l,s,i)=>{l.visible=s>.01;l.rotation.x=-(1-s)*PI/2*.98;l.scale.y=.2+.8*s;l.position.y=.24};
  S1.forEach((l,i)=>pose(l,s1,i));S2.forEach((l,i)=>pose(l,s2,i));
  const sw=Math.sin(t*2.1);canopy.rotation.z=sw*.012;pods.forEach((p,i)=>p.rotation.z=Math.sin(t*2.6+i)*.12);
  bird.position.y=1.6+Math.abs(Math.sin(t*3.2))*.12;wing.rotation.z=Math.sin(t*14)*.35;sun.rotation.z=t*.2;
  steam.forEach((s,i)=>{s.position.y=1.3+((t*.35+i*.33)%1)*.35;s.scale.setScalar(1-((t*.35+i*.33)%1)*.3)});
  const push=smooth(0,2.2,t)*(1-smooth(5.4,6,t)),z=10.2-push*.9-turn*.3;
  camera.position.set(-.4+turn*.6,6.6-push*.4,z);camera.lookAt(0,1.05,-.35);
  renderer.render(scene,camera);
 }
 document.fonts.load('800 92px Fraunces').then(()=>document.fonts.load('italic 600 92px Fraunces')).then(()=>document.fonts.ready).then(()=>{
  [rib1,rib2].forEach((l,i)=>{const m=l.children[0].children[0];const map=ribbonTex(i?['Beans become','chocolate.']:['Pods grow on','cocoa trees.']);map.repeat.set(1/3.6,1/.5);map.offset.set(.5,0);m.material[0].map=map;m.material[0].needsUpdate=true});
  const clock={t:0},tl=gsap.timeline({paused:true});tl.to(clock,{t:D,duration:D,ease:'none',onUpdate:()=>draw(clock.t)},0);
  window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;window.addEventListener('hf-seek',e=>draw(e.detail.time));draw(0);
 });
})();
</script>
</body></html>
