<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1088,height=800">
<title>LED wall: the early bird gets the worm</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1088px;height:800px;overflow:hidden}
#root{position:relative;width:1088px;height:800px;overflow:hidden;background:#05060b}
canvas{position:absolute;inset:0;width:100%;height:100%}
.grain{position:absolute;inset:0;pointer-events:none;background:url('assets/noise.png') repeat;opacity:.08;mix-blend-mode:screen}
</style>
</head>
<body><main id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1088" data-height="800" data-fps="30">
<canvas id="stage" class="clip" data-start="0" data-duration="6" data-track-index="1" data-layout-ignore></canvas>
<div class="grain" data-layout-ignore></div></main>
<script src="assets/vendor/three.min.js"></script><script src="assets/vendor/gsap.min.js"></script><script>
/* Motion Index original: a pixel cartoon played on a wall of real lamps, from one lamp up to the whole gantry. Inspired by Futurepedia's 3D Style Atlas (LED Wall); our own code. */
(() => {
 const T=THREE, W=1088, H=800, D=6, PI=Math.PI;
 const clamp=n=>Math.max(0,Math.min(1,n)), smooth=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
 const LW=96,LH=54,TW=96,TH=9,P=.1;
 const renderer=new T.WebGLRenderer({canvas:document.querySelector('#stage'),antialias:true,preserveDrawingBuffer:true});
 renderer.setPixelRatio(1);renderer.setSize(W,H,false);renderer.outputColorSpace=T.SRGBColorSpace;
 const scene=new T.Scene();scene.background=new T.Color(0x05060b);const camera=new T.PerspectiveCamera(32,W/H,.01,200);
 scene.add(new T.HemisphereLight(0x8090b0,0x080808,.5));const moon=new T.DirectionalLight(0x9fb0d8,.7);moon.position.set(-4,6,8);scene.add(moon);
 // The 2D cartoon is drawn at lamp resolution, then each lamp takes its pixel's colour.
 const pic=document.createElement('canvas');pic.width=LW;pic.height=LH;const g=pic.getContext('2d');
 const tick=document.createElement('canvas');tick.width=TW;tick.height=TH;const tg=tick.getContext('2d');
 const FONT={A:'01110100011000111111100011000110001',B:'11110100011111010001100011000111110',D:'11110100011000110001100011000111110',E:'11111100001111010000100001000011111',
  G:'01111100001000010011100011000101111',H:'10001100011000111111100011000110001',I:'01110001000010000100001000010001110',K:'10001100101010011000101001001010001',
  L:'10000100001000010000100001000011111',M:'10001110111010110001100011000110001',O:'01110100011000110001100011000101110',R:'11110100011000111110101001001010001',
  S:'01111100000111000001000011000111110',T:'11111001000010000100001000010000100',W:'10001100011000110101101011101110001',Y:'10001100010101000100001000010000100',
  '.':'00000000000000000000000000110001100',' ':'00000000000000000000000000000000000'};
 function text(str,x0,col){tg.fillStyle=col;let x=x0;for(const ch of str){const f=FONT[ch]||FONT[' '];for(let i=0;i<35;i++)if(f[i]==='1')tg.fillRect(x+i%5,1+Math.floor(i/5),1,1);x+=6}}
 const BIRD=['..kk....','.kkkk.o.','kkwkkkoo','kkkkkk..','.kk.....','..y.y...'],WING=['...kk...','..kkk...','.kkk....'];
 function paint(t){g.imageSmoothingEnabled=false;const rise=smooth(0,2.4,t);
  const sky=g.createLinearGradient(0,0,0,LH);sky.addColorStop(0,`rgb(${20+40*rise},${30+70*rise},${70+90*rise})`);sky.addColorStop(1,`rgb(${60+180*rise},${50+110*rise},${80+30*rise})`);g.fillStyle=sky;g.fillRect(0,0,LW,LH);
  g.fillStyle='#ffd34a';const sy=Math.round(44-rise*20);g.beginPath();g.arc(24,sy,6,0,PI*2);g.fill();g.fillStyle='rgba(255,220,120,.35)';g.beginPath();g.arc(24,sy,9,0,PI*2);g.fill();
  g.fillStyle='#ffffff';[[60,10],[64,9],[68,10],[66,8]].forEach(([x,y])=>g.fillRect(Math.round(x-t*1.5),y,5,2));
  g.fillStyle='#2f7a3a';for(let x=0;x<LW;x++){const h=40+Math.round(Math.sin(x*.12)*2+Math.sin(x*.31)*1);g.fillRect(x,h,1,LH-h)}g.fillStyle='#3f9a46';for(let x=0;x<LW;x+=3)g.fillRect(x,40+Math.round(Math.sin(x*.12)*2),1,1);
  g.fillStyle='#6b4428';g.fillRect(80,22,4,20);g.fillStyle='#2e8a43';[[82,18,9],[76,22,6],[88,23,6]].forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,PI*2);g.fill()});
  g.fillStyle='#7a4a24';g.fillRect(77,25,7,2);
  const caught=t>3.75,wx=56,wy=41;g.fillStyle='#3a2414';g.fillRect(wx-2,wy+1,5,1);
  if(!caught){const up=Math.round(smooth(.8,1.3,t)*3),wig=Math.round(Math.sin(t*10));g.fillStyle='#f08aa0';for(let i=0;i<up;i++)g.fillRect(wx+(i%2?wig:0),wy-i,1,1);if(up)g.fillRect(wx+wig,wy-up,1,1)}
  let bx,by;if(t<2.2){bx=-12;by=10}else if(t<3.75){const k=smooth(2.2,3.75,t);bx=-10+k*(wx-6+10);by=10+Math.sin(k*PI*.5)*(wy-16)}else{const k=smooth(3.75,4.9,t);bx=wx-6+k*(78-wx+6);by=wy-6-k*(wy-6-16)}
  bx=Math.round(bx);by=Math.round(by);
  BIRD.forEach((row,y)=>[...row].forEach((c,x)=>{if(c==='.')return;g.fillStyle=c==='k'?'#2a2a3a':c==='o'?'#ff9a2a':c==='w'?'#ffffff':'#ff9a2a';g.fillRect(bx+x,by+y,1,1)}));
  if(t>2.2&&t<4.9&&Math.floor(t*8)%2===0)WING.forEach((row,y)=>[...row].forEach((c,x)=>{if(c==='k'){g.fillStyle='#45455a';g.fillRect(bx+x,by-3+y,1,1)}}));
  if(caught&&t<4.9){g.fillStyle='#f08aa0';g.fillRect(bx+7,by+3,1,2)}
  tg.fillStyle='#120a04';tg.fillRect(0,0,TW,TH);const a=smooth(.2,.6,t)*(1-smooth(3.1,3.3,t)),b=smooth(3.35,3.7,t);
  if(a>0)text('THE EARLY BIRD',Math.round(6+(1-a)*-60),'#ffb21e');if(b>0)text('GETS THE WORM.',Math.round(6+(1-b)*90),'#ffb21e')}
 // Lamps: frosted round lenses on black louvred cabinets, with three tiny chips under each lens.
 const lens=new T.CircleGeometry(.038,20),chipG=new T.PlaneGeometry(.011,.011);
 function wall(cols,rows,y0){const n=cols*rows,lm=new T.InstancedMesh(lens,new T.MeshBasicMaterial({color:0xffffff}),n),chips=new T.InstancedMesh(chipG,new T.MeshBasicMaterial({color:0xffffff}),n*3),glow=new T.InstancedMesh(new T.CircleGeometry(.075,20),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.18,blending:T.AdditiveBlending,depthWrite:false}),n);
  const m=new T.Matrix4();for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const i=r*cols+c,x=(c-(cols-1)/2)*P,y=y0-r*P;m.makeTranslation(x,y,.012);lm.setMatrixAt(i,m);m.makeTranslation(x,y,.02);glow.setMatrixAt(i,m);
   for(let k=0;k<3;k++){m.makeTranslation(x-.013+k*.013,y,.006);chips.setMatrixAt(i*3+k,m)}}
  [lm,chips,glow].forEach(o=>{o.instanceColor=new T.InstancedBufferAttribute(new Float32Array(o.count*3),3);scene.add(o)});lm.material.transparent=true;lm.material.opacity=.92;return {lm,chips,glow,cols,rows}}
 const main=wall(LW,LH,LH*P/2+.55),tk=wall(TW,TH,-2.45);
 const cab=new T.MeshStandardMaterial({color:0x0b0b0e,roughness:.6,metalness:.3});
 const back=new T.Mesh(new T.BoxGeometry(LW*P+.3,LH*P+.3,.2),cab);back.position.set(0,.55,-.1);scene.add(back);
 const tback=new T.Mesh(new T.BoxGeometry(TW*P+.3,TH*P+.2,.2),cab);tback.position.set(0,-2.45-TH*P/2+.05,-.1);scene.add(tback);
 const louvre=new T.InstancedMesh(new T.BoxGeometry(LW*P,.012,.05),cab,LH+TH);const mm=new T.Matrix4();for(let r=0;r<LH;r++){mm.makeTranslation(0,main.rows*P/2+.55-r*P+.045,.03);louvre.setMatrixAt(r,mm)}for(let r=0;r<TH;r++){mm.makeTranslation(0,-2.45-r*P+.045,.03);louvre.setMatrixAt(LH+r,mm)}scene.add(louvre);
 const seamM=new T.MeshBasicMaterial({color:0x000000});for(let c=1;c<6;c++){const s=new T.Mesh(new T.BoxGeometry(.012,LH*P,.06),seamM);s.position.set(-LW*P/2+c*LW*P/6,.55,.04);scene.add(s)}
 // Steel gantry, a city skyline and a few stars around the screen.
 const steel=new T.MeshStandardMaterial({color:0x6a6e76,metalness:.8,roughness:.45});
 const beam=(x,y,w,h,d=.12)=>{const b=new T.Mesh(new T.BoxGeometry(w,h,d),steel);b.position.set(x,y,-.25);scene.add(b)};
 beam(0,LH*P/2+.75,LW*P+.8,.16);beam(0,-3.5,LW*P+.8,.16);beam(0,-2.25,LW*P+.4,.08);[-1,1].forEach(s=>{beam(s*(LW*P/2+.3),-2,.16,6.4);for(let k=0;k<8;k++){const d=new T.Mesh(new T.BoxGeometry(.05,.95,.05),steel);d.position.set(s*(LW*P/2+.3),-4.2+k*.8,-.25);d.rotation.z=k%2?.6:-.6;scene.add(d)}});
 const city=new T.Group();for(let i=0;i<30;i++){const w=.8+Math.abs(Math.sin(i*7.3))*1.6,h=2+Math.abs(Math.sin(i*3.1))*6;const b=new T.Mesh(new T.BoxGeometry(w,h,.5),new T.MeshBasicMaterial({color:0x0c0f1c}));b.position.set(-22+i*1.5,-5+h/2,-9);city.add(b);
  for(let k=0;k<6;k++){const wl=new T.Mesh(new T.PlaneGeometry(.12,.16),new T.MeshBasicMaterial({color:Math.sin(i*k)>.3?0xffc76a:0x1a2032}));wl.position.set(b.position.x-w/3+(k%3)*w/3,-5+h*.4+Math.floor(k/3)*.6,-8.7);city.add(wl)}}scene.add(city);
 const stars=new T.Points(new T.BufferGeometry().setAttribute('position',new T.Float32BufferAttribute(Array.from({length:360},(_,i)=>i%3===0?Math.sin(i*12.9)*26:i%3===1?2+Math.abs(Math.sin(i*7.7))*12:-12),3)),new T.PointsMaterial({color:0xffffff,size:.06}));scene.add(stars);
 const tmp=new T.Color();
 function feed(w,ctx,cw,ch){const d=ctx.getImageData(0,0,cw,ch).data;for(let i=0;i<cw*ch;i++){const r=d[i*4]/255,gg=d[i*4+1]/255,b=d[i*4+2]/255;
  tmp.setRGB(.07+r*1.1,.07+gg*1.1,.08+b*1.1,T.SRGBColorSpace);w.lm.instanceColor.setXYZ(i,tmp.r,tmp.g,tmp.b);w.glow.instanceColor.setXYZ(i,tmp.r,tmp.g,tmp.b);
  w.chips.instanceColor.setXYZ(i*3,r*3,0,0);w.chips.instanceColor.setXYZ(i*3+1,0,gg*3,0);w.chips.instanceColor.setXYZ(i*3+2,0,0,b*3)}
  [w.lm,w.glow,w.chips].forEach(o=>o.instanceColor.needsUpdate=true)}
 function draw(t){paint(t);feed(main,g,LW,LH);feed(tk,tg,TW,TH);
  const out=smooth(.6,2.4,t)*(1-smooth(5.3,6,t)),e=out*out*(3-2*out);
  const near=new T.Vector3(-2.3,-.25,.42),far=new T.Vector3(.2,-.7,15.4),lookN=new T.Vector3(-2.35,-.22,0),lookF=new T.Vector3(0,-.15,0);
  const k=Math.pow(e,1.6);camera.position.copy(near).lerp(far,k);camera.lookAt(lookN.clone().lerp(lookF,k));
  main.lm.material.opacity=.75+.25*k;main.glow.material.opacity=.06+.16*k;
  renderer.render(scene,camera)}
 const clock={t:0},tl=gsap.timeline({paused:true});tl.to(clock,{t:D,duration:D,ease:'none',onUpdate:()=>draw(clock.t)},0);
 window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;window.addEventListener('hf-seek',e=>draw(e.detail.time));draw(0);
})();
</script>
</body></html>
