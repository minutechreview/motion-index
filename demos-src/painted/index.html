<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1088,height=800">
<title>Painted: a lighthouse at dusk</title>
<style>
@font-face{font-family:Caveat;src:url('assets/fonts/caveat700.woff2');font-weight:700}
*{box-sizing:border-box}html,body{margin:0;width:1088px;height:800px;overflow:hidden}
#root{position:relative;width:1088px;height:800px;overflow:hidden;background:#efe6d2}
canvas{position:absolute;inset:0;width:100%;height:100%}
.cap{position:absolute;left:58px;bottom:56px;padding:10px 20px 12px;background:#f3ead6;color:#2b2118;font:700 36px/1 Caveat,cursive;box-shadow:0 4px 0 rgba(60,40,20,.18);transform-origin:left center}
</style>
</head>
<body><main id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1088" data-height="800" data-fps="30">
<canvas id="stage" class="clip" data-start="0" data-duration="6" data-track-index="1" data-layout-ignore></canvas>
<div class="cap" id="c0">At dusk, the light starts to turn.</div><div class="cap" id="c1">And the boats find their way home.</div></main>
<script src="assets/vendor/three.min.js"></script><script src="assets/vendor/gsap.min.js"></script><script>
/* Motion Index original: any lit 3D scene repainted as oil on canvas (Kuwahara + brush dabs + linen + ragged edge). Inspired by Futurepedia's 3D Style Atlas (Painted); our own code. */
(() => {
 const T=THREE, W=1088, H=800, D=6, PI=Math.PI;
 const clamp=n=>Math.max(0,Math.min(1,n)), smooth=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
 const rng=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(21);
 const renderer=new T.WebGLRenderer({canvas:document.querySelector('#stage'),antialias:false,preserveDrawingBuffer:true});
 renderer.setPixelRatio(1);renderer.setSize(W,H,false);renderer.outputColorSpace=T.SRGBColorSpace;
 const rt=new T.WebGLRenderTarget(W,H,{samples:4,type:T.HalfFloatType});rt.texture.colorSpace=T.LinearSRGBColorSpace;
 const scene=new T.Scene(),camera=new T.PerspectiveCamera(36,W/H,.1,400);
 // Dusk sky dome with the low sun.
 const sky=new T.Mesh(new T.SphereGeometry(200,32,16),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,uniforms:{},vertexShader:'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 p;void main(){float h=p.y;vec3 hz=vec3(1.0,.62,.36),mid=vec3(.62,.42,.62),top=vec3(.12,.18,.42);vec3 c=mix(hz,mid,smoothstep(.0,.18,h));c=mix(c,top,smoothstep(.16,.6,h));float s=pow(max(0.,dot(p,normalize(vec3(-.55,.06,-1.)))),180.);c+=vec3(1.,.85,.6)*s*2.+vec3(1.,.6,.3)*pow(max(0.,dot(p,normalize(vec3(-.55,.06,-1.)))),8.)*.4;gl_FragColor=vec4(c,1.);}'}));
 scene.add(sky);
 scene.add(new T.HemisphereLight(0xffc89a,0x223050,.9));const sun=new T.DirectionalLight(0xffb070,2.4);sun.position.set(-30,8,-40);scene.add(sun);const rim=new T.DirectionalLight(0x8090ff,.5);rim.position.set(20,10,20);scene.add(rim);
 const sea=new T.Mesh(new T.PlaneGeometry(300,300,120,120),new T.MeshStandardMaterial({color:0x4d7aa6,roughness:.3,metalness:.05,emissive:0x2a3f66,emissiveIntensity:.55}));sea.rotation.x=-PI/2;scene.add(sea);const seaBase=Float32Array.from(sea.geometry.attributes.position.array);
 const glint=new T.Mesh(new T.PlaneGeometry(6,60),new T.MeshBasicMaterial({color:0xffb46a,transparent:true,opacity:.45,blending:T.AdditiveBlending,depthWrite:false}));glint.rotation.x=-PI/2;glint.position.set(-10,.08,-30);glint.rotation.z=-.35;glint.scale.set(2,1.4,1);glint.visible=false;scene.add(glint);
 // Cliffs with grass tops, the lighthouse and its keeper's cottage.
 const cliffG=new T.CylinderGeometry(9,12,7,40,8);{const p=cliffG.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),n=1+.12*Math.sin(Math.atan2(z,x)*7+y)+.08*Math.sin(y*2.1+x*.4);p.setX(i,x*n);p.setZ(i,z*n)}cliffG.computeVertexNormals()}
 const cliff=new T.Mesh(cliffG,new T.MeshStandardMaterial({color:0x7a6252,roughness:1,flatShading:true}));cliff.position.set(10,1.8,-14);scene.add(cliff);
 const grass=new T.Mesh(new T.CylinderGeometry(9.6,9.2,.6,40),new T.MeshStandardMaterial({color:0x5b8a3c,roughness:1}));grass.position.set(10,5.5,-14);scene.add(grass);
 const lh=new T.Group();lh.position.set(9,5.8,-15);scene.add(lh);
 for(let i=0;i<5;i++){const s=new T.Mesh(new T.CylinderGeometry(1.25-i*.11-.11,1.25-i*.11,1.8,32),new T.MeshStandardMaterial({color:i%2?0xb8332c:0xf2ece0,roughness:.7}));s.position.y=.9+i*1.8;lh.add(s)}
 const gallery=new T.Mesh(new T.CylinderGeometry(1.1,1.1,.2,32),new T.MeshStandardMaterial({color:0x2b2b30}));gallery.position.y=9.1;lh.add(gallery);
 const lamp=new T.Mesh(new T.CylinderGeometry(.62,.62,1.2,24),new T.MeshStandardMaterial({color:0xfff0b0,emissive:0xffd060,emissiveIntensity:1.2}));lamp.position.y=9.8;lh.add(lamp);
 const roof=new T.Mesh(new T.ConeGeometry(.85,1,24),new T.MeshStandardMaterial({color:0x2b2b30}));roof.position.y=10.9;lh.add(roof);
 const beamG=new T.ConeGeometry(3.2,38,32,1,true);beamG.translate(0,-19,0);beamG.rotateZ(PI/2);
 const beam=new T.Mesh(beamG,new T.MeshBasicMaterial({color:0xffe6a0,transparent:true,opacity:.22,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide}));beam.position.y=9.8;lh.add(beam);
 const cot=new T.Group();cot.position.set(13.5,5.8,-11);scene.add(cot);const cw=new T.Mesh(new T.BoxGeometry(3,1.8,2.2),new T.MeshStandardMaterial({color:0xe8dcc6}));cw.position.y=.9;cot.add(cw);
 const cr=new T.Mesh(new T.ConeGeometry(2.3,1.3,4),new T.MeshStandardMaterial({color:0x8c3a2c}));cr.position.y=2.4;cr.rotation.y=PI/4;cr.scale.z=.8;cot.add(cr);
 const win=new T.Mesh(new T.PlaneGeometry(.6,.6),new T.MeshStandardMaterial({color:0xffd27a,emissive:0xffb040,emissiveIntensity:0}));win.position.set(-.6,1,1.11);cot.add(win);
 const cloudM=new T.MeshStandardMaterial({color:0xffd2c0,emissive:0xc08a8a,emissiveIntensity:.8,roughness:1});
 [[-60,22,-170,8],[-25,30,-180,6],[35,19,-160,7],[75,27,-190,9],[-95,16,-150,6]].forEach(([x,y,z,r])=>{const g=new T.Group();for(let k=0;k<5;k++){const m=new T.Mesh(new T.SphereGeometry(r*(.5+rng()*.5),16,10),cloudM);m.position.set((k-2)*r*.7,rng()*r*.2,0);m.scale.y=.35;g.add(m)}g.position.set(x,y,z);scene.add(g)});
 const foam=new T.Mesh(new T.TorusGeometry(11.3,.5,6,60),new T.MeshStandardMaterial({color:0xe9eef2,emissive:0x405060,emissiveIntensity:.4}));foam.rotation.x=PI/2;foam.position.set(10,.1,-14);foam.scale.y=1.1;scene.add(foam);
 // A small boat sailing in from open water.
 const boat=new T.Group();scene.add(boat);const hull=new T.Mesh(new T.BoxGeometry(3.4,.8,1.2),new T.MeshStandardMaterial({color:0x8a3b2a,emissive:0x2a120c,emissiveIntensity:.5}));hull.position.y=.25;boat.add(hull);
 const sail=new T.Mesh(new T.BufferGeometry().setFromPoints([new T.Vector3(-.2,.6,0),new T.Vector3(-.2,4.2,0),new T.Vector3(1.9,.6,0)]),new T.MeshStandardMaterial({color:0xf2e6d0,side:T.DoubleSide}));sail.geometry.computeVertexNormals();boat.add(sail);
 const bl=new T.PointLight(0xffc060,0,6);bl.position.set(-.8,1,0);boat.add(bl);
 const birds=[];for(let i=0;i<5;i++){const b=new T.Mesh(new T.BufferGeometry().setFromPoints([new T.Vector3(-.5,.15,0),new T.Vector3(0,0,0),new T.Vector3(.5,.15,0)]),new T.LineBasicMaterial({color:0x2a2030}));
  const l=new T.Line(b.geometry,b.material);l.userData={x:-14+i*1.4,y:16+rng()*3,o:rng()*6};scene.add(l);birds.push(l)}
 // Paint pass: generalized Kuwahara over four sectors, then dab texture, impasto light, linen weave and a ragged unpainted edge.
 const quad=new T.Mesh(new T.PlaneGeometry(2,2),new T.ShaderMaterial({uniforms:{src:{value:rt.texture},res:{value:new T.Vector2(W,H)},time:{value:0}},depthTest:false,
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:`uniform sampler2D src;uniform vec2 res;uniform float time;varying vec2 vUv;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
  vec3 kuwa(vec2 uv){const int R=5;vec2 px=1./res;vec3 m[4];vec3 s[4];for(int k=0;k<4;k++){m[k]=vec3(0.);s[k]=vec3(0.);}
   for(int j=-R;j<=0;j++)for(int i=-R;i<=0;i++){vec3 c;c=texture2D(src,uv+vec2(i,j)*px).rgb;m[0]+=c;s[0]+=c*c;c=texture2D(src,uv+vec2(i+R,j)*px).rgb;m[1]+=c;s[1]+=c*c;
    c=texture2D(src,uv+vec2(i,j+R)*px).rgb;m[2]+=c;s[2]+=c*c;c=texture2D(src,uv+vec2(i+R,j+R)*px).rgb;m[3]+=c;s[3]+=c*c;}
   float N=float((R+1)*(R+1));float best=1e9;vec3 outc=vec3(0.);for(int k=0;k<4;k++){vec3 mu=m[k]/N;vec3 v=abs(s[k]/N-mu*mu);float sv=v.r+v.g+v.b;if(sv<best){best=sv;outc=mu;}}return outc;}
  float dabs(vec2 p){float a=.5+(n(p*.0035)-.5)*2.2;mat2 r=mat2(cos(a),-sin(a),sin(a),cos(a));vec2 q=r*p;float row=floor(q.y/7.);float d=n(vec2(q.x*.045+row*3.1,row*.7));float tip=n(vec2(q.x*.02+row*1.7,row));return d*.7+n(vec2(q.x*.12,q.y*.5))*.3*tip;}
  void main(){vec2 p=vUv*res;vec3 c=kuwa(vUv);
   float d=dabs(p),dx=dabs(p+vec2(1.5,0.))-d,dy=dabs(p+vec2(0.,1.5))-d;vec3 nrm=normalize(vec3(-dx*6.,-dy*6.,1.));float lit=dot(nrm,normalize(vec3(-.5,.6,.65)));
   c*=.95+.1*d;c+=(lit-.75)*.035;c+=(vec3(n(p*.013),n(p*.011+7.),n(p*.017+3.))-.5)*.05;
   c=pow(max(c,0.),vec3(1./2.2));c=mix(c,c*vec3(1.04,1.,.94),.5);
   float weave=.5+.5*sin(p.x*1.6)*sin(p.y*1.6);c*=.95+.06*weave;
   vec2 e=min(vUv,1.-vUv)*res;float edge=min(e.x,e.y)-18.-n(p*.05)*22.-n(p*.3)*6.;vec3 canvasC=vec3(.94,.9,.82)*(.94+.06*weave);
   float m=smoothstep(0.,3.,edge);gl_FragColor=vec4(mix(canvasC,c,m),1.);}`}));
 const post=new T.Scene(),pcam=new T.OrthographicCamera(-1,1,1,-1,0,1);post.add(quad);
 const caps=[document.querySelector('#c0'),document.querySelector('#c1')];
 function draw(t){
  const sp=sea.geometry.attributes.position;for(let i=0;i<sp.count;i++){const x=seaBase[i*3],y=seaBase[i*3+1];sp.setZ(i,Math.sin(x*.3+t*2.0944)*.18+Math.sin(y*.21-t*1.0472)*.22)}sp.needsUpdate=true;sea.geometry.computeVertexNormals();
  beam.rotation.y=-.6+t*1.0472;lamp.material.emissiveIntensity=1.1+.6*Math.sin(t*3.1416);beam.material.opacity=.2;win.material.emissiveIntensity=.5+.8*smooth(1.0,2.0,t)*(1-smooth(5.3,6,t));
  const k=smooth(2.6,5.6,t)*(1-smooth(5.6,6,t))+0;boat.position.set(-24+t/D*31,Math.sin(t*2.0944)*.15,-6-t/D*2);boat.rotation.y=-.25;boat.rotation.z=Math.sin(t*2.0944)*.05;bl.intensity=3;
  birds.forEach((b,i)=>{const u=b.userData;b.position.set(u.x+Math.sin(t*1.0472+u.o)*3,u.y+Math.sin(t*2.0944+u.o)*.4,-30);b.scale.set(1,1+Math.sin(t*12.566+i)*.6,1)});
  const push=smooth(0,5.3,t)*(1-smooth(5.3,6,t));camera.position.set(-12+push*1.6,8.5-push*.4,30-push*2.4);camera.lookAt(1,4.2,-12);
  renderer.setRenderTarget(rt);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(post,pcam);
  caps.forEach((el,i)=>{const a=i?3.1:.4,b=i?5.6:2.9,o=smooth(a,a+.35,t)*(1-smooth(b-.25,b,t));el.style.opacity=o;el.style.transform=`rotate(-1.2deg) scaleX(${.96+.04*o})`});
 }
 document.fonts.ready.then(()=>{
  const clock={t:0},tl=gsap.timeline({paused:true});tl.to(clock,{t:D,duration:D,ease:'none',onUpdate:()=>draw(clock.t)},0);
  window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;window.addEventListener('hf-seek',e=>draw(e.detail.time));draw(0);
 });
})();
</script>
</body></html>
