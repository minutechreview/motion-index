<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1088,height=800">
<title>Glass and light: a three-layer density tower</title>
<style>
@font-face{font-family:Manrope;src:url('assets/fonts/manrope600.ttf');font-weight:600}
@font-face{font-family:Manrope;src:url('assets/fonts/manrope800.ttf');font-weight:800}
*{box-sizing:border-box}html,body{margin:0;width:1088px;height:800px;overflow:hidden}
#root{position:relative;width:1088px;height:800px;overflow:hidden;background:#101318}
canvas{position:absolute;inset:0;width:100%;height:100%}
.title{position:absolute;left:52px;top:46px;font:800 30px/1.1 Manrope,sans-serif;color:#f4efe6}
.title small{display:block;margin-top:6px;font:600 17px/1 Manrope,sans-serif;color:#a9b0bb}
.list{position:absolute;right:56px;top:250px;display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:14px;font:600 22px/1.15 Manrope,sans-serif;color:#f4efe6}
.row i{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 14px currentColor}
.row b{font-weight:800}
.row span{display:block;font-size:15px;color:#a9b0bb;margin-top:3px}
.grain{position:absolute;inset:0;pointer-events:none;background:url('assets/noise.png') repeat;opacity:.07;mix-blend-mode:screen}
</style>
</head>
<body><main id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1088" data-height="800" data-fps="30">
<canvas id="stage" class="clip" data-start="0" data-duration="6" data-track-index="1" data-layout-ignore></canvas>
<div class="title">A density tower<small>Heaviest sinks, lightest floats</small></div>
<div class="list"><div class="row" id="r0"><i style="color:#e0a033;background:#e0a033"></i><div><b>Honey</b><span>heaviest, goes to the bottom</span></div></div>
<div class="row" id="r1"><i style="color:#4aa8ff;background:#4aa8ff"></i><div><b>Water</b><span>sits in the middle</span></div></div>
<div class="row" id="r2"><i style="color:#e9d84a;background:#e9d84a"></i><div><b>Oil</b><span>lightest, floats on top</span></div></div></div>
<div class="grain" data-layout-ignore></div></main>
<script src="assets/vendor/three.min.js"></script><script src="assets/vendor/gsap.min.js"></script><script>
/* Motion Index original: real glassware on stone, liquids that pour and layer, each throwing its own coloured light. Inspired by Futurepedia's 3D Style Atlas (Glass and Light); our own code. */
(() => {
 const T=THREE, W=1088, H=800, D=6, PI=Math.PI;
 const clamp=n=>Math.max(0,Math.min(1,n)), smooth=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
 const rng=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(17);
 const renderer=new T.WebGLRenderer({canvas:document.querySelector('#stage'),antialias:true,preserveDrawingBuffer:true});
 renderer.setPixelRatio(1);renderer.setSize(W,H,false);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
 const scene=new T.Scene(),camera=new T.PerspectiveCamera(30,W/H,.1,100);
 const tex=(w,h,draw)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;return t};
 // Glowing backdrop and environment for the glass to reflect.
 const wall=new T.Mesh(new T.PlaneGeometry(40,20),new T.MeshBasicMaterial({map:tex(512,256,(g,w,h)=>{const gr=g.createRadialGradient(w*.42,h*.42,10,w*.42,h*.42,w*.55);gr.addColorStop(0,'#e8d2b0');gr.addColorStop(.35,'#6a5a4c');gr.addColorStop(1,'#121316');g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle='rgba(10,8,6,.45)';for(let i=0;i<9;i++)g.fillRect(40+i*52,0,20,h)})}));wall.position.set(0,5,-8);scene.add(wall);
 const env=new T.Scene();env.add(new T.Mesh(new T.SphereGeometry(10),new T.MeshBasicMaterial({color:0x20262e,side:T.BackSide})));
 [[0,4,-8,10,6],[-7,5,3,2,8],[7,5,3,2,8]].forEach(([x,y,z,w,h])=>{const b=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:0xffffff}));b.material.color.multiplyScalar(2.2);b.position.set(x,y,z);b.lookAt(0,1,0);env.add(b)});
 scene.environment=new T.PMREMGenerator(renderer).fromScene(env,.02).texture;
 const key=new T.SpotLight(0xfff1de,90,40,.45,.6,1.5);key.position.set(-2,9,-4);key.target.position.set(0,0,0);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.0004;scene.add(key,key.target);
 scene.add(new T.HemisphereLight(0x9fb2c8,0x111111,.5));
 const stone=tex(1024,1024,(g,w,h)=>{g.fillStyle='#2a2c30';g.fillRect(0,0,w,h);for(let i=0;i<20000;i++){const v=30+rng()*40;g.fillStyle=`rgba(${v},${v+2},${v+6},${rng()*.5})`;g.fillRect(rng()*w,rng()*h,2,2)}});
 const table=new T.Mesh(new T.BoxGeometry(30,.4,14),new T.MeshStandardMaterial({map:stone,roughness:.55,metalness:.1}));table.position.y=-.2;table.receiveShadow=true;scene.add(table);
 // The tall glass, its printed measure marks, and the three liquid layers.
 const glassM=new T.MeshPhysicalMaterial({color:0xffffff,roughness:.03,transparent:true,opacity:.16,side:T.DoubleSide,clearcoat:1,envMapIntensity:1.6,depthWrite:false});
 const prof=[[0,0],[.9,0],[.95,.06],[.95,3.6],[.98,3.66],[.92,3.66],[.88,3.6],[.88,.14],[0,.14]].map(([r,y])=>new T.Vector2(r,y));
 const glass=new T.Mesh(new T.LatheGeometry(prof,96),glassM);glass.castShadow=true;scene.add(glass);
 const marks=new T.Mesh(new T.CylinderGeometry(.955,.955,3.2,64,1,true,-.6,1.2),new T.MeshBasicMaterial({transparent:true,depthWrite:false,map:tex(256,512,(g,w,h)=>{g.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<=16;i++){const y=h-(i/16)*h*.96-6;g.fillRect(w*.42,y,i%4?w*.08:w*.16,3)}})}));marks.position.y=1.9;scene.add(marks);
 const L=[{c:0xe0901e,e:0x7a3e00,from:0,to:.95,a:.95,b:1.85,ad:1.0},{c:0x4aa2f5,e:0x0b3a7a,from:.95,to:2.1,a:2.25,b:3.15,ad:1.6},{c:0xf2dc48,e:0x6a5a00,from:2.1,to:2.95,a:3.55,b:4.45,ad:2.6}];
 L.forEach(l=>{l.m=new T.Mesh(new T.CylinderGeometry(.86,.86,1,64),new T.MeshPhysicalMaterial({color:l.c,emissive:l.e,emissiveIntensity:.45,roughness:.06,transmission:.92,thickness:1.7,ior:1.4,attenuationColor:new T.Color(l.c),attenuationDistance:l.ad,clearcoat:1}));l.m.position.y=.14;scene.add(l.m);
  l.top=new T.Mesh(new T.CircleGeometry(.86,64),new T.MeshStandardMaterial({color:l.c,emissive:l.e,emissiveIntensity:1.1,roughness:.05}));l.top.rotation.x=-PI/2;scene.add(l.top);
  l.pool=new T.Mesh(new T.PlaneGeometry(3.4,2.2),new T.MeshBasicMaterial({color:l.c,transparent:true,blending:T.AdditiveBlending,depthWrite:false,map:tex(256,256,(g,w,h)=>{const gr=g.createRadialGradient(w/2,h/2,4,w/2,h/2,w/2);gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);
   g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=2;for(let i=0;i<10;i++){g.beginPath();for(let a=0;a<=20;a++){const x=w*.2+a/20*w*.6,y=h*.3+i*h*.04+Math.sin(a*.9+i*2)*8;a?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}})}));l.pool.rotation.x=-PI/2;scene.add(l.pool)});
 // Three small jugs that lift, tilt and pour in turn.
 const jugProf=[[0,0],[.42,0],[.45,.05],[.45,.7],[.3,.95],[.18,1.15],[.2,1.25],[.15,1.25],[.13,1.15],[.25,.95],[.4,.7],[.4,.07],[0,.07]].map(([r,y])=>new T.Vector2(r,y));
 const jugM=new T.MeshPhysicalMaterial({color:0xffffff,roughness:.05,transparent:true,opacity:.28,side:T.DoubleSide,clearcoat:1,depthWrite:false});
 const jugs=L.map((l,i)=>{const g=new T.Group();const j=new T.Mesh(new T.LatheGeometry(jugProf,48),jugM);j.castShadow=true;const fill=new T.Mesh(new T.CylinderGeometry(.38,.38,.6,32),l.m.material);fill.position.y=.38;g.add(j,fill);g.userData={fill,home:new T.Vector3(-3.4+i*.0,0,0)};scene.add(g);return g});
 const homes=[[2.6,0,1.5],[3.7,0,.6],[3.5,0,2.4]];jugs.forEach((g,i)=>g.position.set(...homes[i]));
 const stream=new T.Mesh(new T.CylinderGeometry(.045,.04,1,12),new T.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.9,roughness:.05,emissive:0x000000}));scene.add(stream);
 const rows=[0,1,2].map(i=>document.querySelector('#r'+i));
 function draw(t){
  const reset=smooth(5.35,5.95,t);let surface=.14;
  L.forEach((l,i)=>{const k=smooth(l.a,l.b,t)*(1-reset),h=(l.to-l.from)*k;l.m.visible=h>.005;l.m.scale.set(1,Math.max(h,.001),1);l.m.position.y=.14+l.from+h/2;l.top.position.y=.14+l.from+h+.002;l.top.visible=false;
   l.pool.position.set(.6+i*.25,.01,1.25+i*.15);l.pool.material.opacity=.5*k;if(k>0)surface=Math.max(surface,.14+l.from+h)});
  let pouring=-1;jugs.forEach((g,i)=>{const l=L[i],up=smooth(l.a-.45,l.a-.05,t)*(1-smooth(l.b,l.b+.4,t)),hm=homes[i];
   const target=new T.Vector3(1.05,4.15,.15);g.position.set(hm[0]+(target.x-hm[0])*up,hm[1]+(target.y-hm[1])*up,hm[2]+(target.z-hm[2])*up);g.rotation.z=up*2.05;
   g.userData.fill.scale.y=1-.85*smooth(l.a,l.b,t)*(1-reset)+.85*reset*0;if(t>l.a&&t<l.b)pouring=i});
  stream.visible=pouring>=0;if(pouring>=0){const l=L[pouring],lip=new T.Vector3(-.06,3.55,.15),len=lip.y-surface;stream.material.color.setHex(l.c);stream.material.emissive.setHex(l.e);stream.scale.set(1,len,1);stream.position.set(lip.x,surface+len/2,lip.z)}
  rows.forEach((el,i)=>{const on=smooth(L[i].a-.1,L[i].a+.2,t)*(1-reset);el.style.opacity=.25+.75*on;el.style.transform=`translateX(${(1-on)*10}px)`});
  const s=Math.sin(t/D*PI*2);camera.position.set(-.2+s*.6,3.8,12.6);camera.lookAt(1.9,1.7,0);
  renderer.render(scene,camera);
 }
 document.fonts.ready.then(()=>{
  const clock={t:0},tl=gsap.timeline({paused:true});tl.to(clock,{t:D,duration:D,ease:'none',onUpdate:()=>draw(clock.t)},0);
  window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;window.addEventListener('hf-seek',e=>draw(e.detail.time));draw(0);
 });
})();
</script>
</body></html>
