<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1088,height=800">
<title>Spotlight stage: Apollo 11, from launch pad to the Moon</title>
<style>
@font-face{font-family:Oswald;src:url('assets/fonts/oswald600.woff2');font-weight:600}
@font-face{font-family:Fraunces;src:url('assets/fonts/fraunces700.woff2');font-weight:700}
*{box-sizing:border-box}html,body{margin:0;width:1088px;height:800px;overflow:hidden}
#root{position:relative;width:1088px;height:800px;overflow:hidden;background:#0c0708}
canvas{position:absolute;inset:0;width:100%;height:100%}
.grain{position:absolute;inset:0;pointer-events:none;background:url('assets/noise.png') repeat;opacity:.09;mix-blend-mode:screen}
</style>
</head>
<body><main id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1088" data-height="800" data-fps="30">
<canvas id="stage" class="clip" data-start="0" data-duration="6" data-track-index="1" data-layout-ignore></canvas>
<div class="grain" data-layout-ignore></div></main>
<script src="assets/vendor/three.min.js"></script><script src="assets/vendor/gsap.min.js"></script><script>
/* Motion Index original: a toy theatre of painted card scenery under shafts of stage light. Inspired by Futurepedia's 3D Style Atlas (Spotlight Stage); our own code. */
(() => {
 const T=THREE, W=1088, H=800, D=6, PI=Math.PI;
 const clamp=n=>Math.max(0,Math.min(1,n)), smooth=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
 const rng=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(11);
 const renderer=new T.WebGLRenderer({canvas:document.querySelector('#stage'),antialias:true,preserveDrawingBuffer:true});
 renderer.setPixelRatio(1);renderer.setSize(W,H,false);renderer.outputColorSpace=T.SRGBColorSpace;
 renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
 const scene=new T.Scene();scene.background=new T.Color(0x0b0607);
 const camera=new T.PerspectiveCamera(32,W/H,.1,100);
 scene.add(new T.HemisphereLight(0x5a4a66,0x1a0d08,.35));
 const tex=(w,h,draw)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;return t};
 const noise=(g,w,h,a=.05)=>{for(let i=0;i<w*h/90;i++){g.fillStyle=`rgba(${rng()<.5?0:255},${rng()<.5?0:255},${rng()<.5?0:255},${rng()*a})`;g.fillRect(rng()*w,rng()*h,2,2)}};
 // A painted card cut-out: canvas art with a pale die-cut edge, alpha-tested so its shadow follows the outline.
 function cutout(w,h,px,draw){const cw=Math.round(w*px),ch=Math.round(h*px),art=document.createElement('canvas');art.width=cw;art.height=ch;const a=art.getContext('2d');a.scale(px,px);draw(a);
  const map=tex(cw,ch,(g)=>{for(const[dx,dy]of[[3,0],[-3,0],[0,3],[0,-3],[2,2],[-2,2],[2,-2],[-2,-2]])g.drawImage(art,dx,dy);g.globalCompositeOperation='source-in';g.fillStyle='#efe2c8';g.fillRect(0,0,cw,ch);
   g.globalCompositeOperation='source-over';g.drawImage(art,0,0);g.globalCompositeOperation='source-atop';noise(g,cw,ch,.05);g.globalCompositeOperation='source-over'});
  const mat=new T.MeshStandardMaterial({map,alphaTest:.5,roughness:.85,side:T.DoubleSide});
  const m=new T.Mesh(new T.PlaneGeometry(w,h),mat);m.castShadow=true;m.receiveShadow=true;
  m.customDepthMaterial=new T.MeshDepthMaterial({depthPacking:T.RGBADepthPacking,map,alphaTest:.5});return m}
 // Theatre: timber stage, velvet drapes, valance with fringe, footlight lip.
 const planks=tex(1024,512,(g,w,h)=>{for(let i=0;i<10;i++){g.fillStyle=`hsl(26,${38+i%3*6}%,${22+(i*7)%9}%)`;g.fillRect(0,i*h/10,w,h/10);g.fillStyle='rgba(0,0,0,.4)';g.fillRect(0,i*h/10,w,3)}
  for(let i=0;i<500;i++){g.strokeStyle=`rgba(0,0,0,${rng()*.12})`;g.beginPath();const y=rng()*h;g.moveTo(rng()*w,y);g.lineTo(rng()*w,y+rng()*2);g.stroke()}});
 const floor=new T.Mesh(new T.BoxGeometry(12,.4,5),new T.MeshStandardMaterial({map:planks,roughness:.55}));floor.position.set(0,-.2,0);floor.receiveShadow=true;scene.add(floor);
 const velvet=new T.MeshStandardMaterial({color:0x7a0f16,roughness:.75,side:T.DoubleSide});
 function drape(w,h,folds){const g=new T.PlaneGeometry(w,h,90,8),p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i);p.setZ(i,Math.sin(x/w*PI*folds)*.14)}g.computeVertexNormals();const m=new T.Mesh(g,velvet);m.receiveShadow=true;return m}
 const dl=drape(2.6,7,10),dr=drape(2.6,7,10);dl.position.set(-5.05,3.3,1.9);dr.position.set(5.05,3.3,1.9);const foot=new T.PointLight(0xffb070,14,9,1.6);foot.position.set(0,.35,3.4);scene.add(foot);[-1,1].forEach(sx=>{const w=new T.PointLight(0xff9a70,10,6,1.5);w.position.set(sx*4.2,3.2,3.6);scene.add(w)});scene.add(dl,dr);
 const val=drape(12,1.3,26);val.position.set(0,6.05,1.95);scene.add(val);
 const gold=new T.MeshStandardMaterial({color:0xc69a3a,roughness:.35,metalness:.7});
 const fringe=new T.InstancedMesh(new T.CylinderGeometry(.03,.03,.32,5),gold,120);for(let i=0;i<120;i++){const m=new T.Matrix4().setPosition(-5.9+i*.1,5.28,2.05+Math.sin(i)*.02);fringe.setMatrixAt(i,m)}scene.add(fringe);
 const proscen=new T.Mesh(new T.BoxGeometry(12.4,.25,.3),gold);proscen.position.set(0,5.42,2.1);scene.add(proscen);
 const arch=new T.Mesh(new T.BoxGeometry(13,1.6,.2),new T.MeshStandardMaterial({color:0x1a0c0a,roughness:.6}));arch.position.set(0,6.32,2.28);scene.add(arch);const trim=new T.Mesh(new T.BoxGeometry(13,.07,.1),gold);trim.position.set(0,5.56,2.4);scene.add(trim);
 const lip=new T.Mesh(new T.BoxGeometry(12,.18,.18),gold);lip.position.set(0,.01,2.5);scene.add(lip);
 // Stage lights: two warm spots, a cool back light, and visible beams in haze.
 const spot=(c,i,pos,tg)=>{const s=new T.SpotLight(c,i,30,.32,.6,1.4);s.position.set(...pos);s.target.position.set(...tg);s.castShadow=true;s.shadow.mapSize.set(1024,1024);s.shadow.bias=-.0005;scene.add(s,s.target);return s};
 const keyA=spot(0xffd6a0,170,[-3.5,8,6],[-.6,1.6,-.6]),keyB=spot(0xffe4bd,120,[3.8,8,6],[1.4,1.2,-.4]),backL=spot(0x8fb2ff,60,[0,7,-4],[0,1,0]);
 const beamTex=tex(64,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(255,255,255,.0)');gr.addColorStop(.15,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h)});
 function beam(from,to,r,color,op){const len=from.distanceTo(to),g=new T.ConeGeometry(r,len,32,1,true);g.translate(0,-len/2,0);
  const m=new T.Mesh(g,new T.MeshBasicMaterial({map:beamTex,color,transparent:true,opacity:op,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide}));
  m.position.copy(from);m.lookAt(to);m.rotateX(-PI/2);scene.add(m);return m}
 const beams=[beam(new T.Vector3(-3.5,8,6),new T.Vector3(-.6,0,-.6),1.9,0xffd09a,.2),beam(new T.Vector3(3.8,8,6),new T.Vector3(1.4,0,-.4),1.6,0xffe4bd,.15)];
 const dust=new T.Points(new T.BufferGeometry().setAttribute('position',new T.Float32BufferAttribute(Array.from({length:900},(_,i)=>i%3===0?(rng()-.5)*9:i%3===1?rng()*6:(rng()-.5)*4),3)),
  new T.PointsMaterial({color:0xffe6c0,size:.025,transparent:true,opacity:.55,blending:T.AdditiveBlending,depthWrite:false}));scene.add(dust);
 // Scene 1: Florida night, the launch tower and the rocket. Scene 2: the Moon, Earth in the sky, the lander.
 const nightDrop=cutout(9.6,5.6,90,g=>{const gr=g.createLinearGradient(0,0,0,5.6);gr.addColorStop(0,'#141a3a');gr.addColorStop(.75,'#3b3f6e');gr.addColorStop(1,'#7a5a6a');g.fillStyle=gr;g.fillRect(0,0,9.6,5.6);
  g.fillStyle='#fff8e0';for(let i=0;i<70;i++){g.globalAlpha=.4+rng()*.6;g.beginPath();g.arc(rng()*9.6,rng()*3.6,.012+rng()*.02,0,PI*2);g.fill()}g.globalAlpha=1;
  g.fillStyle='#232848';g.beginPath();g.moveTo(0,5.6);for(let x=0;x<=9.6;x+=.2)g.lineTo(x,4.7-Math.sin(x*1.3)*.12-Math.sin(x*3.1)*.05);g.lineTo(9.6,5.6);g.fill()});
 const moonDrop=cutout(9.6,5.6,90,g=>{g.fillStyle='#07080f';g.fillRect(0,0,9.6,5.6);g.fillStyle='#fffbe8';for(let i=0;i<110;i++){g.globalAlpha=.3+rng()*.7;g.beginPath();g.arc(rng()*9.6,rng()*4.6,.01+rng()*.018,0,PI*2);g.fill()}g.globalAlpha=1;
  g.fillStyle='#2f6fb3';g.beginPath();g.arc(7.4,1.2,.48,0,PI*2);g.fill();g.fillStyle='#4f9a5a';g.beginPath();g.ellipse(7.25,1.1,.2,.28,.4,0,PI*2);g.fill();g.ellipse(7.62,1.38,.14,.1,0,0,PI*2);g.fill();
  g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.ellipse(7.5,.95,.25,.05,.2,0,PI*2);g.fill();g.fillStyle='rgba(0,0,0,.55)';g.beginPath();g.arc(7.62,1.25,.48,-PI*.35,PI*.65);g.fill()});
 [nightDrop,moonDrop].forEach(m=>{m.material.emissive=new T.Color(0xffffff);m.material.emissiveMap=m.material.map;m.material.emissiveIntensity=.42});nightDrop.position.set(0,2.85,-2);moonDrop.position.set(0,2.85,-1.96);scene.add(nightDrop,moonDrop);
 const ground1=cutout(9.6,1.2,90,g=>{g.fillStyle='#2b3527';g.beginPath();g.moveTo(0,1.2);for(let x=0;x<=9.6;x+=.3)g.lineTo(x,.35+Math.sin(x*2.2)*.1);g.lineTo(9.6,1.2);g.fill();
  g.fillStyle='#3b4a33';for(let i=0;i<40;i++){const x=rng()*9.6;g.beginPath();g.moveTo(x,1.2);g.lineTo(x+.05,.45+rng()*.25);g.lineTo(x+.1,1.2);g.fill()}});
 ground1.position.set(0,.55,.6);scene.add(ground1);
 const moonGround=cutout(9.6,1.4,90,g=>{g.fillStyle='#9a9aa0';g.beginPath();g.moveTo(0,1.4);for(let x=0;x<=9.6;x+=.2)g.lineTo(x,.35+Math.sin(x*1.4)*.1+Math.sin(x*4)*.04);g.lineTo(9.6,1.4);g.fill();
  for(let i=0;i<16;i++){const x=rng()*9.6,y=.7+rng()*.55,r=.1+rng()*.18;g.fillStyle='#7d7d84';g.beginPath();g.ellipse(x,y,r,r*.35,0,0,PI*2);g.fill();g.fillStyle='#b8b8bd';g.beginPath();g.ellipse(x+.02,y+.03,r*.8,r*.22,0,0,PI);g.fill()}});
 moonGround.position.set(0,.65,.7);scene.add(moonGround);
 const tower=cutout(1.1,4.4,110,g=>{g.strokeStyle='#c4462f';g.lineWidth=.06;g.strokeRect(.25,.1,.6,4.3);for(let y=.1;y<4.4;y+=.3){g.beginPath();g.moveTo(.25,y);g.lineTo(.85,y+.3);g.moveTo(.85,y);g.lineTo(.25,y+.3);g.stroke()}
  g.fillStyle='#c4462f';[1.2,2.3,3.2].forEach(y=>g.fillRect(.85,y,.25,.06))});
 tower.position.set(-1.25,2.2,-.4);scene.add(tower);
 const rocket=cutout(.95,4.2,120,g=>{g.fillStyle='#f3efe6';g.beginPath();g.moveTo(.475,0);g.quadraticCurveTo(.62,.35,.62,.62);g.lineTo(.62,3.6);g.lineTo(.85,4.15);g.lineTo(.1,4.15);g.lineTo(.33,3.6);g.lineTo(.33,.62);g.quadraticCurveTo(.33,.35,.475,0);g.fill();
  g.fillStyle='#1d1d22';[[.9,.16],[1.9,.12],[2.95,.18]].forEach(([y,h])=>g.fillRect(.33,y,.29,h));for(let i=0;i<4;i++)g.fillRect(.33+(i%2)*.145,3.15+Math.floor(i/2)*.18,.145,.18);
  g.fillStyle='#c4462f';g.font='bold .16px sans-serif';g.save();g.translate(.53,2.2);g.rotate(PI/2);g.fillText('USA',-.15,0);g.restore()});
 const flame=cutout(.8,1.4,120,g=>{const gr=g.createLinearGradient(0,0,0,1.4);gr.addColorStop(0,'#fff6c8');gr.addColorStop(.4,'#ffb43a');gr.addColorStop(1,'rgba(230,80,30,.0)');g.fillStyle=gr;g.beginPath();g.moveTo(.1,0);g.quadraticCurveTo(.4,1.6,.7,0);g.fill()});
 flame.material=new T.MeshBasicMaterial({map:flame.material.map,transparent:true,depthWrite:false,blending:T.AdditiveBlending,side:T.DoubleSide});flame.castShadow=false;
 const rocketG=new T.Group();rocket.position.y=2.1;flame.position.y=-.65;rocketG.add(rocket,flame);rocketG.position.set(-.35,.25,-.3);scene.add(rocketG);
 const smokes=[];for(let i=0;i<7;i++){const s=cutout(1,.7,100,g=>{g.fillStyle='#e9e4dc';[[.3,.42,.26],[.55,.35,.3],[.75,.45,.22],[.45,.25,.2]].forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,PI*2);g.fill()})});
  s.userData={x:-.35+(i-3)*.42,z:.1+(i%2)*.15};scene.add(s);smokes.push(s)}
 const lander=cutout(1.4,1.4,120,g=>{g.fillStyle='#d9b24a';g.beginPath();g.moveTo(.3,.75);g.lineTo(1.1,.75);g.lineTo(1.2,1.05);g.lineTo(.2,1.05);g.fill();
  g.fillStyle='#c9c9cf';g.beginPath();g.moveTo(.4,.75);g.lineTo(.45,.3);g.lineTo(.95,.3);g.lineTo(1,.75);g.fill();g.fillStyle='#2a2a33';g.fillRect(.6,.42,.18,.14);
  g.strokeStyle='#bfa043';g.lineWidth=.05;[[.25,1.05,.05,1.38],[1.15,1.05,1.35,1.38],[.45,1.05,.4,1.38],[.95,1.05,1,1.38]].forEach(([a,b,c,d])=>{g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()});
  g.fillStyle='#bfa043';[[.05,1.38],[1.35,1.38],[.4,1.38],[1,1.38]].forEach(([x,y])=>g.fillRect(x-.1,y-.03,.2,.04))});
 scene.add(lander);
 const wire=new T.Mesh(new T.CylinderGeometry(.006,.006,6,4),new T.MeshBasicMaterial({color:0x777777}));scene.add(wire);
 // Easel caption card: front for scene 1, back for scene 2; it flips during the scene change.
 const capTex=(a,b,c)=>tex(640,420,(g,w,h)=>{g.fillStyle='#f2e8d2';g.fillRect(0,0,w,h);g.strokeStyle='#3b2a1c';g.lineWidth=8;g.strokeRect(18,18,w-36,h-36);
  g.fillStyle='#a2281f';g.font='600 34px Oswald';g.textAlign='center';g.fillText(a,w/2,92);g.fillStyle='#22160e';g.font='700 76px Fraunces';g.fillText(b,w/2,206);g.font='600 58px Oswald';g.fillText(c,w/2,300);noise(g,w,h,.05)});
 const easel=new T.Group(),card=new T.Group();
 const front=new T.Mesh(new T.PlaneGeometry(1.9,1.25),new T.MeshStandardMaterial({roughness:.8})),backC=new T.Mesh(new T.PlaneGeometry(1.9,1.25),new T.MeshStandardMaterial({roughness:.8}));
 backC.rotation.y=PI;front.position.z=.012;backC.position.z=-.012;const core=new T.Mesh(new T.BoxGeometry(1.92,1.27,.02),new T.MeshStandardMaterial({color:0xe9dcc0}));
 card.add(core,front,backC);card.position.y=1.15;[front,backC,core].forEach(m=>{m.castShadow=true});
 const legM=new T.MeshStandardMaterial({color:0x4a2e1a,roughness:.7});[-.6,.6].forEach(x=>{const l=new T.Mesh(new T.BoxGeometry(.06,1.2,.06),legM);l.position.set(x,.55,-.05);l.rotation.z=-x*.12;easel.add(l)});
 easel.add(card);easel.position.set(2.85,0,1.25);easel.rotation.y=-.14;easel.scale.setScalar(.92);scene.add(easel);
 function draw(t){
  const out=smooth(2.7,3.5,t),inn=smooth(2.95,3.65,t),reset=smooth(5.45,5.95,t),A=out*(1-reset),B=inn*(1-reset);
  const lift=smooth(1.2,2.9,t)*(1-reset),shake=Math.sin(t*90)*.012*smooth(.9,1.3,t)*(1-smooth(2.4,2.8,t));
  rocketG.position.set(-.35+shake,.25+lift*lift*6.5,-.3);flame.scale.set(1+Math.sin(t*40)*.08,smooth(.9,1.3,t)*(1-reset)*(1+Math.sin(t*33)*.12),1);flame.visible=t>.9&&t<5.4;
  smokes.forEach((s,i)=>{const k=smooth(1+i*.06,2.6,t)*(1-smooth(2.8,3.3,t));s.visible=k>.01;s.position.set(s.userData.x*(1+k*.5)-A*10,.45+k*.55+Math.sin(i*2.1)*k*.2,s.userData.z);s.scale.setScalar(.25+k*.9)});
  nightDrop.position.y=2.85+A*6;tower.position.y=2.2+A*6;ground1.position.x=A*-10;
  moonDrop.position.y=2.85+(1-B)*6;moonGround.position.x=(1-B)*10;
  const land=smooth(3.6,5.0,t)*(1-reset),ly=1.6+(1-land)*3.2+(1-B)*3;lander.position.set(.7,ly,.3);lander.visible=B>.01;wire.position.set(.7,ly+3.65,.3);wire.visible=B>.01;
  const flip=smooth(2.95,3.55,t)*(1-reset);card.rotation.y=flip*PI;
  if(!front.material.map){}
  keyA.intensity=170*(1-.55*smooth(2.6,3,t)*(1-smooth(3.6,4.1,t)));beams[0].material.opacity=.2*(keyA.intensity/170);
  backL.color.setRGB(.55+.45*B,.7,1);dust.rotation.y=t*.03;
  const drift=Math.sin(t/D*PI*2);camera.position.set(drift*.35,3.2,15.2-smooth(0,2,t)*.6*(1-reset));camera.lookAt(0,2.65,0);
  renderer.render(scene,camera);
 }
 Promise.all([document.fonts.load('600 34px Oswald'),document.fonts.load('700 76px Fraunces')]).then(()=>document.fonts.ready).then(()=>{
  front.material.map=capTex('CAPE KENNEDY, FLORIDA','16 July 1969','APOLLO 11 LIFTS OFF');backC.material.map=capTex('THE SEA OF TRANQUILITY','20 July 1969','THE EAGLE HAS LANDED');
  front.material.needsUpdate=backC.material.needsUpdate=true;
  const clock={t:0},tl=gsap.timeline({paused:true});tl.to(clock,{t:D,duration:D,ease:'none',onUpdate:()=>draw(clock.t)},0);
  window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;window.addEventListener('hf-seek',e=>draw(e.detail.time));draw(0);
 });
})();
</script>
