<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1088,height=800"><title>Membership card flip</title><style>
@font-face{font-family:Manrope;src:url('assets/fonts/manrope600.ttf');font-weight:600}@font-face{font-family:Manrope;src:url('assets/fonts/manrope800.ttf');font-weight:800}
*{box-sizing:border-box}html,body{margin:0;width:1088px;height:800px;overflow:hidden}#root{position:relative;width:1088px;height:800px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#f7f8f9,#e0e3e8 76%);color:#121417}canvas{position:absolute;inset:0;width:100%;height:100%}
.perks{position:absolute;left:312px;top:565px;width:480px;display:grid;gap:12px}.perk{display:flex;align-items:center;gap:16px;overflow:hidden;height:41px}.circle{width:31px;height:31px;flex:none;display:grid;place-items:center;border-radius:50%;background:#ff5a1f;transform:scale(0)}.circle svg{width:19px;height:19px;fill:none;stroke:white;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22}.word{font:800 27px/1 Manrope,sans-serif;letter-spacing:-.03em;transform:translateY(45px)}.grain{position:absolute;inset:0;pointer-events:none;background:url('assets/noise.png') repeat;opacity:.08}
</style></head><body><main id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1088" data-height="800" data-fps="30"><canvas id="stage" class="clip" data-start="0" data-duration="5" data-track-index="1" data-layout-ignore></canvas><div class="perks"><div class="perk"><i class="circle"><svg viewBox="0 0 20 20"><path d="M4 10 L8 14 L16 5"/></svg></i><span class="word">All access</span></div><div class="perk"><i class="circle"><svg viewBox="0 0 20 20"><path d="M4 10 L8 14 L16 5"/></svg></i><span class="word">Member pricing</span></div><div class="perk"><i class="circle"><svg viewBox="0 0 20 20"><path d="M4 10 L8 14 L16 5"/></svg></i><span class="word">Early releases</span></div></div><div class="grain" data-layout-ignore></div></main><script src="assets/vendor/three.min.js"></script><script src="assets/vendor/gsap.min.js"></script><script>
/* A hand-built rounded metal card with original front and back typography. */
(() => {
 const T=THREE,W=1088,H=800,clamp=n=>Math.max(0,Math.min(1,n));
 const smooth=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
 const renderer=new T.WebGLRenderer({canvas:document.querySelector('#stage'),alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H,false);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
 const scene=new T.Scene(),camera=new T.PerspectiveCamera(31,W/H,.1,100);camera.position.set(0,0,11);camera.lookAt(0,0,0);
 scene.add(new T.HemisphereLight(0xffffff,0xaeb8c1,2));const key=new T.DirectionalLight(0xffffff,2.8);key.position.set(-4,6,6);scene.add(key);const rim=new T.DirectionalLight(0xffffff,2.4);rim.position.set(4,1,-4);scene.add(rim);
 const shadowCanvas=document.createElement('canvas');shadowCanvas.width=512;shadowCanvas.height=256;const sc=shadowCanvas.getContext('2d'),grad=sc.createRadialGradient(256,128,10,256,128,210);grad.addColorStop(0,'rgba(40,45,51,.22)');grad.addColorStop(1,'rgba(40,45,51,0)');sc.fillStyle=grad;sc.fillRect(0,0,512,256);
 const shadow=new T.Mesh(new T.PlaneGeometry(5.5,3.3),new T.MeshBasicMaterial({map:new T.CanvasTexture(shadowCanvas),transparent:true,depthWrite:false}));shadow.position.set(.1,-.2,-1);scene.add(shadow);
 const group=new T.Group();scene.add(group);const w=4.55,h=2.8,r=.18,shape=new T.Shape();
 shape.moveTo(-w/2+r,-h/2);shape.lineTo(w/2-r,-h/2);shape.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);shape.lineTo(w/2,h/2-r);shape.quadraticCurveTo(w/2,h/2,w/2-r,h/2);shape.lineTo(-w/2+r,h/2);shape.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);shape.lineTo(-w/2,-h/2+r);shape.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
 const card=new T.Mesh(new T.ExtrudeGeometry(shape,{depth:.075,bevelEnabled:true,bevelThickness:.025,bevelSize:.025,bevelSegments:3,curveSegments:12}),new T.MeshStandardMaterial({color:0x15171a,metalness:.72,roughness:.34}));card.position.z=-.037;group.add(card);
 function face(back){const c=document.createElement('canvas');c.width=1200;c.height=738;const x=c.getContext('2d');
   const g=x.createLinearGradient(0,0,1200,738);g.addColorStop(0,'#1c2024');g.addColorStop(.5,'#121417');g.addColorStop(1,'#272b30');x.fillStyle=g;x.fillRect(0,0,1200,738);
   x.strokeStyle='rgba(225,231,236,.12)';x.lineWidth=2;for(let n=0;n<6;n++){x.beginPath();x.ellipse(850,340,350+n*27,220+n*17,-.4,0,Math.PI*2);x.stroke()}
   x.fillStyle='#ff5a1f';x.beginPath();x.arc(100,96,18,0,Math.PI*2);x.fill();x.fillStyle='#f3f5f7';
   if(!back){x.font='800 75px Manrope';x.fillText('FORM / CLUB',144,122);x.font='600 25px Manrope';x.letterSpacing='5px';x.fillText('MADE FOR EVERYDAY',75,640)}
   else{x.font='800 175px Manrope';x.fillText('PLUS',72,350);x.font='800 92px Manrope';x.fillText('$12',76,480);x.font='600 42px Manrope';x.fillText('/mo',249,480)}
   const texture=new T.CanvasTexture(c);texture.colorSpace=T.SRGBColorSpace;return texture}
 let front,back;
 function addFaces(){const geo=new T.PlaneGeometry(w-.035,h-.035);front=new T.Mesh(geo,new T.MeshBasicMaterial({map:face(false)}));front.position.z=.067;group.add(front);back=new T.Mesh(geo,new T.MeshBasicMaterial({map:face(true)}));back.rotation.y=Math.PI;back.position.z=-.067;group.add(back)}
 const perks=[...document.querySelectorAll('.perk')];
 function draw(t){
   const flip=smooth(1,1.75,t)*(1-smooth(4.15,4.9,t)), lift=smooth(1.7,2.2,t)*(1-smooth(4.1,4.75,t));
   group.rotation.y=-.25+Math.PI*flip;group.rotation.x=-.07;group.rotation.z=-.025;group.position.y=.10+lift*.64;group.position.z=.45*Math.sin(Math.PI*flip);
   key.position.x=-4+3*smooth(.4,2.5,t)*(1-smooth(4.05,4.9,t));shadow.position.y=-.18+lift*.45;shadow.scale.setScalar(1-.1*lift);
   perks.forEach((el,i)=>{const p=smooth(2.1+i*.24,2.4+i*.24,t)*(1-smooth(4.0,4.45,t));el.querySelector('.circle').style.transform=`scale(${Math.min(1,p*1.35)})`;el.querySelector('svg').style.strokeDashoffset=String(22*(1-smooth(.28,.95,p)));el.querySelector('.word').style.transform=`translateY(${45*(1-p)}px)`});
   renderer.render(scene,camera);
 }
 document.fonts.ready.then(()=>{addFaces();const clock={t:0},tl=gsap.timeline({paused:true});tl.to(clock,{t:5,duration:5,ease:'none',onUpdate:()=>draw(clock.t)},0);window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;window.addEventListener('hf-seek',e=>draw(e.detail.time));draw(0)});
})();

</script></body></html>
