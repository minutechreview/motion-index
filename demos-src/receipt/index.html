<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1088,height=800"><title>Receipt printer</title><style>
@font-face{font-family:Plex;src:url('assets/fonts/plexmono500.ttf');font-weight:500}@font-face{font-family:Plex;src:url('assets/fonts/plexmono700.ttf');font-weight:700}
*{box-sizing:border-box}html,body{margin:0;width:1088px;height:800px;overflow:hidden}#root{position:relative;width:1088px;height:800px;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#11192b,#06090f 79%)}canvas{position:absolute;inset:0;width:100%;height:100%}.grain{position:absolute;inset:0;pointer-events:none;background:url('assets/noise.png') repeat;opacity:.08}
</style></head><body><main id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1088" data-height="800" data-fps="30"><canvas id="stage" class="clip" data-start="0" data-duration="5" data-track-index="1" data-layout-ignore></canvas><div class="grain" data-layout-ignore></div></main><script src="assets/vendor/three.min.js"></script><script src="assets/vendor/gsap.min.js"></script><script>
/* A real bent 3D sheet feeds from the printer; its ink is part of the paper texture. */
(() => {
 const T=THREE,W=1088,H=800,clamp=n=>Math.max(0,Math.min(1,n));
 const smooth=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
 const renderer=new T.WebGLRenderer({canvas:document.querySelector('#stage'),alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H,false);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.localClippingEnabled=true;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.22;
 const scene=new T.Scene(),camera=new T.PerspectiveCamera(32,W/H,.1,100);scene.add(new T.HemisphereLight(0xd4e3ff,0x111927,1.65));
 const key=new T.DirectionalLight(0xffffff,2.4);key.position.set(-4,7,5);scene.add(key);const rim=new T.DirectionalLight(0xa6c5ff,1.5);rim.position.set(4,4,-3);scene.add(rim);
 const mesh=(geo,mat,x,y,z)=>{const m=new T.Mesh(geo,mat);m.position.set(x,y,z);scene.add(m);return m};
 const body=new T.MeshStandardMaterial({color:0x0e1115,roughness:.56,metalness:.26}),glass=new T.MeshStandardMaterial({color:0x090c12,roughness:.13,metalness:.55}),steel=new T.MeshStandardMaterial({color:0x7c8790,roughness:.27,metalness:.9});
 mesh(new T.BoxGeometry(3.6,.7,2),body,0,.35,0);mesh(new T.BoxGeometry(3.35,.07,1.8),glass,0,.725,0);mesh(new T.BoxGeometry(2.35,.04,.08),steel,0,.79,.58);
 const floor=document.createElement('canvas');floor.width=floor.height=256;const f=floor.getContext('2d'),grad=f.createRadialGradient(128,128,0,128,128,128);grad.addColorStop(0,'rgba(10,15,22,.65)');grad.addColorStop(1,'rgba(10,15,22,0)');f.fillStyle=grad;f.fillRect(0,0,256,256);const shadow=mesh(new T.PlaneGeometry(6,4),new T.MeshBasicMaterial({map:new T.CanvasTexture(floor),transparent:true,depthWrite:false}),0,-.015,0);shadow.rotation.x=-Math.PI/2;
 const ph=3.9,pw=2.18,geometry=new T.PlaneGeometry(pw,ph,40,80),positions=geometry.attributes.position,initial=positions.array.slice();let paper;
 function receiptTexture(){const c=document.createElement('canvas');c.width=800;c.height=1432;const x=c.getContext('2d');x.fillStyle='#f3f5f4';x.fillRect(0,0,c.width,c.height);x.fillStyle='#1c1f25';x.textAlign='center';x.font='700 60px Plex';x.fillText('NORTH / SUPPLY',400,139);x.fillStyle='#61666f';x.font='500 27px Plex';x.fillText('ORDER 001  ·  06.18',400,198);x.setLineDash([8,10]);x.strokeStyle='#888d90';x.lineWidth=3;x.beginPath();x.moveTo(58,245);x.lineTo(742,245);x.stroke();x.setLineDash([]);
   const rows=[['DESIGN STUDY','$ 24'],['MATERIALS','$ 18'],['STUDIO TIME','$ 36'],['DELIVERY','$ 08']];x.font='500 36px Plex';rows.forEach((row,i)=>{x.textAlign='left';x.fillStyle='#1c1f25';x.fillText(row[0],60,328+i*125);x.textAlign='right';x.font='700 38px Plex';x.fillText(row[1],740,328+i*125);x.font='500 36px Plex'});
   x.strokeStyle='#61666f';x.lineWidth=3;[800,816].forEach(y=>{x.beginPath();x.moveTo(60,y);x.lineTo(740,y);x.stroke()});x.textAlign='left';x.fillStyle='#1c1f25';x.font='700 34px Plex';x.fillText('TOTAL',60,910);x.textAlign='right';x.font='700 78px Plex';x.fillText('$ 86',740,914);
   x.fillStyle='#33383d';for(let i=0,pos=125;i<60;i++){const line=1+((i*17+i*i)%4);x.fillRect(pos,1030,line*2,110);pos+=5+line*2}x.textAlign='center';x.font='500 24px Plex';x.fillStyle='#61666f';x.fillText('THANK YOU / 001',400,1225);const tex=new T.CanvasTexture(c);tex.colorSpace=T.SRGBColorSpace;return tex}
 function draw(t){
   const reset=1-smooth(4.05,4.9,t);let feed=.82;for(let i=0;i<6;i++)feed+=.50*smooth(1+i*.36,1.18+i*.36,t)*reset;
   paper.position.y=.79+feed-ph/2;const flex=Math.sin(t*16)*(smooth(1,1.15,t)-smooth(3.35,3.65,t))*.025;
   for(let i=0;i<positions.count;i++){const x=initial[i*3],y=initial[i*3+1],u=(y+ph/2)/ph;const tooth=y>ph/2-.001 && Math.round((x+pw/2)/pw*40)%2 ? .055 : 0;positions.setXYZ(i,x,y-tooth,(u*u*.68)+(x*x*.075)+Math.sin(u*Math.PI)*flex)}positions.needsUpdate=true;geometry.computeVertexNormals();
   const move=smooth(0,3.4,t)*(1-smooth(4.05,4.9,t));camera.position.set(4.0-1.7*move,5.4-1.3*move,9.2+1.2*move);camera.lookAt(0,1.9,0);camera.updateMatrixWorld();renderer.render(scene,camera);
 }
 document.fonts.ready.then(()=>{paper=mesh(geometry,new T.MeshStandardMaterial({map:receiptTexture(),side:T.DoubleSide,roughness:.9,clippingPlanes:[new T.Plane(new T.Vector3(0,1,0),-.79)]}),0,0,.24);const clock={t:0},tl=gsap.timeline({paused:true});tl.to(clock,{t:5,duration:5,ease:'none',onUpdate:()=>draw(clock.t)},0);window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;window.addEventListener('hf-seek',e=>draw(e.detail.time));draw(0)});
})();

</script></body></html>
