<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1088,height=800">
<title>Exploded view: what is inside a flashlight</title>
<style>
@font-face{font-family:Jakarta;src:url('assets/fonts/jakarta800.ttf');font-weight:800}
@font-face{font-family:Plex;src:url('assets/fonts/plexmono700.ttf');font-weight:700}
@font-face{font-family:Plex;src:url('assets/fonts/plexmono500.ttf');font-weight:500}
*{box-sizing:border-box}html,body{margin:0;width:1088px;height:800px;overflow:hidden}
#root{position:relative;width:1088px;height:800px;overflow:hidden;background:#ece8e1}
canvas{position:absolute;inset:0;width:100%;height:100%}
svg{position:absolute;inset:0;width:1088px;height:800px;pointer-events:none}
.kick{position:absolute;left:48px;top:40px;font:500 15px/1 Plex,monospace;letter-spacing:.18em;color:#8a8e9c}
.head{position:absolute;left:48px;top:62px;font:800 34px/1.05 Jakarta,sans-serif;color:#1f2a6b;letter-spacing:-.01em}
.lab{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;font:700 17px/1 Plex,monospace;color:#1a1f3d;letter-spacing:.06em;white-space:nowrap}
.lab b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#26318a;color:#fff;font:700 13px/1 Plex,monospace;letter-spacing:0}
.foot{position:absolute;right:48px;bottom:40px;text-align:right;font:800 28px/1.05 Jakarta,sans-serif;color:#1f2a6b}
.grain{position:absolute;inset:0;pointer-events:none;background:url('assets/noise.png') repeat;opacity:.05;mix-blend-mode:multiply}
</style>
</head>
<body><main id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1088" data-height="800" data-fps="30">
<canvas id="stage" class="clip" data-start="0" data-duration="6" data-track-index="1" data-layout-ignore></canvas>
<svg id="leads" data-layout-ignore></svg>
<div class="kick">TEARDOWN 07</div><div class="head">A POCKET<br>FLASHLIGHT</div>
<div id="labs"></div><div class="foot" id="foot">SEVEN PARTS,<br>ONE BEAM</div>
<div class="grain" data-layout-ignore></div></main>
<script src="assets/vendor/three.min.js"></script><script src="assets/vendor/gsap.min.js"></script><script>
/* Motion Index original: a product comes apart along its axis with numbered callouts. Inspired by Futurepedia's 3D Style Atlas (Exploded View); our own code. */
(() => {
 const T=THREE, W=1088, H=800, D=6, PI=Math.PI;
 const clamp=n=>Math.max(0,Math.min(1,n)), smooth=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
 const back=t=>1-1/(1+Math.exp(0)),ease=(a,b,t)=>{const x=clamp((t-a)/(b-a));return 1-Math.pow(1-x,3)};
 const renderer=new T.WebGLRenderer({canvas:document.querySelector('#stage'),antialias:true,alpha:true,preserveDrawingBuffer:true});
 renderer.setPixelRatio(1);renderer.setSize(W,H,false);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
 const scene=new T.Scene(),camera=new T.PerspectiveCamera(26,W/H,.1,100);
 // Studio environment for reflections: a soft dome with two strip softboxes.
 const envScene=new T.Scene();envScene.add(new T.Mesh(new T.SphereGeometry(20,32,16),new T.MeshBasicMaterial({color:0xd9d6d0,side:T.BackSide})));
 [[-6,5,4,1.4,9],[7,3,-3,1,7],[0,9,0,8,2]].forEach(([x,y,z,w,h])=>{const b=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:0xffffff,side:T.DoubleSide}));b.position.set(x,y,z);b.lookAt(0,0,0);b.material.color.multiplyScalar(3);envScene.add(b)});
 const dark=new T.Mesh(new T.PlaneGeometry(40,6),new T.MeshBasicMaterial({color:0x55524e,side:T.DoubleSide}));dark.position.set(0,-4,0);dark.rotation.x=PI/2;envScene.add(dark);
 const pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromScene(envScene,.02).texture;
 const key=new T.DirectionalLight(0xffffff,2.2);key.position.set(-3,8,5);key.castShadow=true;Object.assign(key.shadow.camera,{left:-7,right:7,top:5,bottom:-5});key.shadow.mapSize.set(2048,2048);key.shadow.radius=8;key.shadow.bias=-.0004;scene.add(key);
 scene.add(new T.HemisphereLight(0xffffff,0xb9b2a8,.6));
 const floor=new T.Mesh(new T.PlaneGeometry(60,40),new T.ShadowMaterial({opacity:.18}));floor.rotation.x=-PI/2;floor.position.y=-1.15;floor.receiveShadow=true;scene.add(floor);
 const M={alu:new T.MeshStandardMaterial({color:0xc9542c,metalness:.85,roughness:.32}),chrome:new T.MeshStandardMaterial({color:0xffffff,metalness:1,roughness:.06}),
  steel:new T.MeshStandardMaterial({color:0xd8dade,metalness:1,roughness:.22}),rubber:new T.MeshStandardMaterial({color:0x26262b,roughness:.8}),
  glass:new T.MeshPhysicalMaterial({color:0xd8ecff,metalness:0,roughness:.02,transparent:true,opacity:.55,clearcoat:1}),
  cell:new T.MeshStandardMaterial({color:0x1f6f6a,roughness:.35,metalness:.3}),cap:new T.MeshStandardMaterial({color:0xc7c9cc,metalness:1,roughness:.25}),
  led:new T.MeshStandardMaterial({color:0xfff6d8,emissive:0xfff0c0,emissiveIntensity:0}),board:new T.MeshStandardMaterial({color:0x2c6b3a,roughness:.6})};
 // Lathe profiles are drawn as (radius, x) and turned about the x axis.
 const lathe=(pts,mat,seg=72)=>{const g=new T.LatheGeometry(pts.map(([r,x])=>new T.Vector2(r,x)),seg);g.rotateZ(-PI/2);const m=new T.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;return m};
 const tube=(ro,ri,a,b)=>[[ri,a],[ro,a],[ro,b],[ri,b],[ri,a]];
 const root=new T.Group();root.rotation.y=.38;root.position.set(.2,0,0);scene.add(root);const parts=[];const part=(name,obj,home,exp,anchor,side)=>{const g=new T.Group();g.add(obj);g.position.set(home,0,0);root.add(g);parts.push({name,g,home,exp,anchor:new T.Vector3(...anchor),side});return g};
 // 1 Head with knurled flare, 2 lens, 3 reflector + LED board, 4 body tube with grip rings, 5 cells, 6 spring, 7 tail cap with rubber switch.
 const head=new T.Group();head.add(lathe([[.38,0],[.43,0],[.62,.75],[.66,.78],[.66,.98],[.58,.98],[.58,.82],[.38,.1],[.38,0]],M.alu));
 for(let i=0;i<24;i++){const r=new T.Mesh(new T.BoxGeometry(.5,.035,.035),M.alu);const a=i/24*PI*2;r.position.set(.42,Math.cos(a)*.56,Math.sin(a)*.56);r.rotation.x=a;r.rotation.z=.25;r.castShadow=true;head.add(r)}
 const lens=new T.Group();lens.add(lathe([[0,0],[.56,0],[.56,.05],[0,.08]],M.glass),lathe(tube(.6,.54,-.01,.07),M.steel));
 const refl=new T.Group();refl.add(lathe([[.1,0],[.16,0],[.3,.25],[.46,.55],[.55,.72],[.5,.72],[.42,.56],[.27,.27],[.12,.04],[.1,0]],M.chrome));
 const pcb=lathe([[0,-.06],[.36,-.06],[.36,0],[0,0]],M.board);const led=new T.Mesh(new T.BoxGeometry(.1,.12,.12),M.led);led.position.x=.03;refl.add(pcb,led);
 const body=new T.Group();body.add(lathe(tube(.4,.34,0,3.0),M.alu));for(let i=0;i<9;i++){const r=new T.Mesh(new T.TorusGeometry(.405,.022,8,48),M.alu);r.rotation.y=PI/2;r.position.x=1.7+i*.13;r.castShadow=true;body.add(r)}
 const ring=lathe(tube(.42,.4,.15,.32),M.rubber);body.add(ring);
 const cells=new T.Group();[0,1].forEach(i=>{const c=new T.Group();c.add(lathe(tube(.3,0,0,1.2),M.cell),lathe(tube(.301,0,.98,1.2),M.cap),lathe([[0,-.08],[.1,-.08],[.12,0],[0,0]],M.cap));c.position.x=i*1.32;cells.add(c)});
 const pts=[];for(let i=0;i<=180;i++){const a=i/180*PI*2*7;pts.push(new T.Vector3(i/180*.7,Math.cos(a)*.2,Math.sin(a)*.2))}
 const spring=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),400,.022,8,false),M.steel);spring.castShadow=true;
 const tail=new T.Group();tail.add(lathe([[.3,0],[.42,0],[.42,.62],[.36,.7],[.2,.7],[.2,.66],[.3,.6],[.3,0]],M.alu),lathe([[0,.62],[.2,.62],[.19,.82],[0,.86]],M.rubber));
 // Assembled positions (x of each part's local origin) and exploded positions along the same axis.
 const L=-1.4;
 part('LENS',lens,L-.92,L-3.75,[-.03,.55,0],1);part('HEAD',head,L,L-2.05,[-.6,.62,0],-1);
 part('REFLECTOR + LED',refl,L-.13,L-1.05,[-.45,.45,0],1);
 part('BODY',body,L+.1,L+.25,[1.6,.42,0],-1);part('CELLS',cells,L+.35,L+3.45,[.6,.31,0],1);
 part('SPRING',spring,L+3.0,L+6.15,[.35,.22,0],-1);part('TAIL CAP',tail,L+3.05,L+7.15,[.4,.42,0],1);
 [head,lens,refl].forEach(o=>{o.rotation.y=PI;});
 const labWrap=document.querySelector('#labs'),svg=document.querySelector('#leads');
 parts.forEach((p,i)=>{p.el=document.createElement('div');p.el.className='lab';p.el.innerHTML=(p.side>0?`<b>${i+1}</b>${p.name}`:`${p.name}<b>${i+1}</b>`);labWrap.appendChild(p.el);
  p.line=document.createElementNS('http://www.w3.org/2000/svg','line');p.line.setAttribute('stroke','#26318a');p.line.setAttribute('stroke-width','1.6');svg.appendChild(p.line);
  p.dot=document.createElementNS('http://www.w3.org/2000/svg','circle');p.dot.setAttribute('r','3.2');p.dot.setAttribute('fill','#26318a');svg.appendChild(p.dot)});
 const order=[0,1,2,3,4,5,6];
 const foot=document.querySelector('#foot');
 function draw(t){
  const out=smooth(.7,2.1,t),inn=smooth(5.1,5.85,t),k=out*(1-inn);
  parts.forEach((p,i)=>{const kk=smooth(.7+i*.06,2.1+i*.04,t)*(1-inn);p.g.position.x=p.home+(p.exp-p.home)*kk;p.g.position.y=Math.sin(kk*PI)*.18*(i%2?1:-1)+kk*(i%2?.12:-.12);
   p.g.rotation.x=kk*(i%2?.25:-.2)+Math.sin(t*1.3+i)*.03*kk});
  led.material.emissiveIntensity=2.5*smooth(4.2,4.6,t)*(1-smooth(5.1,5.4,t));
  const orb=Math.sin(t/D*PI*2);camera.position.set(-.6+orb*.8+k*.3,4.6+k*.6,15.5+k*4.6);camera.lookAt(.5+k*.45,-.1+k*.12,0);camera.updateMatrixWorld();
  scene.updateMatrixWorld();renderer.render(scene,camera);
  const hide=1-smooth(5.0,5.25,t);
  parts.forEach((p,i)=>{const at=2.0+order.indexOf(i)*.26,r=ease(at,at+.32,t)*hide,a=p.anchor.clone();p.g.localToWorld(a);const v=a.project(camera),x=(v.x*.5+.5)*W,y=(-v.y*.5+.5)*H;
   const ly=y+p.side*-118*(i===2?1.25:1)-(i===5?10:0),lx=x+(i%3-1)*14;
   p.line.setAttribute('x1',x);p.line.setAttribute('y1',y);p.line.setAttribute('x2',x+(lx-x)*r);p.line.setAttribute('y2',y+(ly-y)*r);p.line.style.opacity=r>0?1:0;p.dot.setAttribute('cx',x);p.dot.setAttribute('cy',y);p.dot.style.opacity=r>0?1:0;
   const w=p.w;p.el.style.transform=`translate(${lx-(p.side>0?12:w-12)}px,${ly-12-(p.side<0?10:-10)}px) scale(${.6+.4*r})`;p.el.style.opacity=r;});
  foot.style.opacity=smooth(4.0,4.4,t)*hide;foot.style.transform=`translateY(${(1-smooth(4.0,4.4,t))*12}px)`;
 }
 document.fonts.ready.then(()=>{
  parts.forEach(p=>p.w=p.el.offsetWidth);
  const clock={t:0},tl=gsap.timeline({paused:true});tl.to(clock,{t:D,duration:D,ease:'none',onUpdate:()=>draw(clock.t)},0);
  window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;window.addEventListener('hf-seek',e=>draw(e.detail.time));draw(0);
 });
})();
</script>
</body></html>
